<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6fed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Haus-Tasks">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="shortcut icon" href="favicon.ico">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Haus-Tasks</title>
<style>
  :root {
    --bg: #fafafa; --card: #ffffff; --text: #1c2230; --muted: #6b7280; --line: #eceef1;
    --accent: #2f6fed; --accent-text: #ffffff; --danger: #d92d20; --ok: #12a150; --chip: #f1f2f4;
    --radius: 14px; --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 1px rgba(16,24,40,.03);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101216; --card: #1b1e24; --text: #e8ebf2; --muted: #9aa1ac; --line: #2a2e35;
      --accent: #5b8cff; --accent-text: #0e1420; --danger: #f97066; --ok: #47cd89; --chip: #22262d;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 16px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  header a.brand { font-size: 19px; font-weight: 700; color: inherit; text-decoration: none; display: flex; align-items: center; gap: 6px; }
  .inbox-badge { background: var(--accent); color: var(--accent-text); font-size: 11px; font-weight: 700; line-height: 1;
    padding: 3px 7px; border-radius: 999px; }
  .sync { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .dot.ok { background: var(--ok); } .dot.err { background: var(--danger); }
  button { font: inherit; cursor: pointer; }
  .btn { border: 1px solid var(--line); background: var(--card); color: var(--text); padding: 9px 16px; border-radius: 999px; transition: border-color .15s, background .15s; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn.danger { color: var(--danger); }
  .btn.small { padding: 5px 12px; font-size: 13px; }
  .icon-btn { border: none; background: none; color: var(--muted); padding: 6px; border-radius: 8px; line-height: 1; }
  .icon-btn:hover { color: var(--danger); background: var(--chip); }
  .icon-btn.invite { text-decoration: none; }
  .icon-btn.invite:hover { color: var(--accent); }

  /* Klappbare Abschnitte ("Anstehend"/"Später") – bewusst unauffälliger als der frühere Navigationsblock. */
  .section { margin-bottom: 18px; }
  .section-header { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 4px 0; user-select: none; }
  .toggle-icon { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; min-width: 22px;
    border-radius: 50%; background: var(--chip); font-weight: 700; font-size: 15px; line-height: 1; }
  .section-header:hover .toggle-icon { background: var(--accent); color: var(--accent-text); }

  /* Schnellerfassung: bewusst nur ein Titel-Feld, Enter legt sofort einen Inbox-Task an. */
  .quick-capture { width: 100%; padding: 13px 16px; font-size: 15px; border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--card); color: var(--text); margin-bottom: 10px; box-shadow: var(--shadow); }
  .quick-capture:focus { outline: none; border-color: var(--accent); }
  .inbox-list { display: grid; gap: 8px; margin-bottom: 18px; }
  .inbox-row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; padding: 10px 12px;
    background: var(--card); border: 1px dashed var(--line); border-radius: var(--radius); }
  .inbox-row .title { cursor: pointer; }
  .inbox-row .actions { display: flex; align-items: center; gap: 4px; }
  /* Deutlich sichtbarer Rahmen statt der reinen Chip-Füllung: die sonst übliche .badge-Füllfarbe
     (--chip) liegt hier auf einem ebenfalls schon getönten Untergrund (Inbox-Zeile/Task-Karte) und
     ist dort kaum vom Hintergrund zu unterscheiden. */
  .badge.list-move { border: 1px solid var(--line); background: var(--bg); color: var(--text); font-weight: 600; cursor: pointer; font: inherit; }
  .badge.list-move:hover { border-color: var(--accent); color: var(--accent); }
  .badge.list-move.ok { border-color: var(--ok); color: var(--ok); }
  .badge.list-move.ok:hover { background: color-mix(in srgb, var(--ok) 15%, transparent); }

  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 8px; }
  .toolbar label { color: var(--muted); font-size: 13px; }
  .filters { margin-bottom: 14px; }
  .filters .group { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 6px; }
  .filters .group > b { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; width: 74px; }
  .manage-link { text-transform: none; letter-spacing: normal; color: var(--muted); text-decoration: none; }
  .manage-link:hover { color: var(--accent); }
  .chip { border: 1px solid var(--line); background: var(--chip); color: var(--text); padding: 3px 10px; border-radius: 999px; font-size: 13px; }
  .chip.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  select, input, textarea { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
  select:focus, input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  .list { display: flex; flex-direction: column; gap: 10px; }
  .date { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 58px; padding: 5px 0; border-radius: 10px;
    background: var(--chip); line-height: 1.1; text-align: center; cursor: pointer; transition: background .15s; }
  .date:hover { background: color-mix(in srgb, var(--accent) 15%, var(--chip)); }
  .date .day { font-size: 24px; font-weight: 700; }
  .date .wd, .date .mon { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .date .time { font-size: 10px; color: inherit; font-weight: 600; margin-top: 1px; }
  .date.soon { background: color-mix(in srgb, var(--accent) 20%, transparent); color: var(--accent); }
  .date.late { background: color-mix(in srgb, var(--danger) 18%, transparent); color: var(--danger); }
  .date.soon .wd, .date.soon .mon, .date.late .wd, .date.late .mon { color: inherit; }
  .date.done, .date.none { opacity: .55; }
  /* Unsichtbarer Auslöser für den nativen Datumswähler, siehe Funktion dateTile weiter unten. */
  .date-input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; border: 0; padding: 0; pointer-events: none; }
  .task { display: grid; grid-template-columns: auto auto 1fr auto; gap: 12px; align-items: center; background: var(--card);
    border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; box-shadow: var(--shadow); transition: box-shadow .15s, border-color .15s; }
  .task:hover { border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }
  .task.done { opacity: .72; }
  .task.done .title { text-decoration: line-through; color: var(--muted); }
  /* Runde Checkbox statt eckigem Häkchen. width/height allein reichten nicht in jedem Browser (Grid-
     Kinder werden sonst auf die Spaltenbreite gestreckt); aspect-ratio plus min/max-Werte erzwingen das
     Quadrat zusätzlich, unabhängig von Stretching-Effekten. */
  .task input[type=checkbox] { appearance: none; -webkit-appearance: none; -moz-appearance: none;
    width: 22px; height: 22px; min-width: 22px; min-height: 22px; max-width: 22px; max-height: 22px;
    aspect-ratio: 1; border-radius: 50%; margin: 0; padding: 0;
    border: 2px solid var(--line); background: var(--card); display: grid; place-content: center; cursor: pointer;
    justify-self: center; align-self: center; flex: none;
    transition: border-color .15s, background .15s; }
  .task input[type=checkbox]::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: #fff; transform: scale(0); transition: transform .12s; }
  .task input[type=checkbox]:checked { border-color: var(--accent); background: var(--accent); }
  .task input[type=checkbox]:checked::before { transform: scale(1); }
  .task .main { min-width: 0; cursor: pointer; }
  .title { font-weight: 600; overflow-wrap: anywhere; letter-spacing: -.01em; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 10px; margin-top: 4px; font-size: 12.5px; color: var(--muted); align-items: center; }
  .badge { padding: 2px 9px; border-radius: 999px; background: var(--chip); font-size: 12px; display: inline-flex; align-items: center; gap: 5px; }
  .empty { text-align: center; color: var(--muted); padding: 32px 0; }

  .avatar { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px;
    min-width: 28px; min-height: 28px; max-width: 28px; max-height: 28px; aspect-ratio: 1; border-radius: 50%;
    background: var(--ac, var(--muted)); color: #fff; font-size: 12px; font-weight: 700; flex: none; justify-self: center; align-self: center; }
  .avatar.sm { width: 22px; height: 22px; min-width: 22px; min-height: 22px; max-width: 22px; max-height: 22px; font-size: 11px; }
  .avatar-picker { display: flex; flex-wrap: wrap; gap: 8px; }
  .avatar-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; padding: 2px; color: var(--muted); font-size: 12px; border-radius: 10px; }
  .avatar-btn .avatar { border: 3px solid transparent; }
  .avatar-btn.on .avatar { border-color: var(--text); }
  .avatar-btn.on { color: var(--text); font-weight: 600; }

  .group-card { margin-bottom: 20px; }
  .group-card h2 { display: flex; align-items: center; gap: 10px; font-size: 17px; margin: 0 0 8px; }
  .group-card h2 span.count { color: var(--muted); font-weight: 400; font-size: 13px; }
  .swatch { width: 14px; height: 14px; border-radius: 50%; display: inline-block; background: var(--c); }
  .backlink { color: var(--accent); text-decoration: none; font-size: 14px; }
  h1 { font-size: 22px; margin: 6px 0 16px; }

  dialog { border: 1px solid var(--line); border-radius: 16px; background: var(--card); color: var(--text); width: min(560px, calc(100vw - 24px)); padding: 0; }
  dialog::backdrop { background: rgba(10,14,22,.5); }
  form { padding: 20px; display: grid; gap: 14px; }
  form h3 { margin: 0; font-size: 18px; }
  .field { display: grid; gap: 4px; }
  .field > label { font-size: 13px; color: var(--muted); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .inline { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .inline input[type=number] { width: 72px; }
  .swatches { display: flex; flex-wrap: wrap; gap: 8px; }
  .sw { width: 28px; height: 28px; border-radius: 50%; border: 3px solid transparent; background: var(--c); padding: 0; }
  .sw.on { border-color: var(--text); }
  .actions { display: flex; justify-content: space-between; gap: 8px; margin-top: 4px; }
  .actions .right { display: flex; gap: 8px; }
  .error { color: var(--danger); font-size: 13px; min-height: 1em; }
  .sync-info { color: var(--muted); font-size: 11px; margin: -8px 0 10px; }
  .hint { color: var(--muted); font-size: 13px; }

  /* Einrichtungsbildschirme: Anmeldung, Kalender-ID */
  .step { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; margin-top: 20px; display: grid; gap: 14px; max-width: 440px; }
  .step h1 { margin: 0; font-size: 20px; }
  .step .lead { color: var(--muted); margin: 0; }

  /* Erneute Anmeldung mitten in der Nutzung: nicht die ganze Ansicht ersetzen, nur ein schmaler Hinweis
     mit Ein-Klick-Anmeldung – die zwischengespeicherten Tasks bleiben währenddessen sichtbar. */
  .auth-banner { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: color-mix(in srgb, var(--accent) 12%, var(--card));
    border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line)); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 14px; font-size: 14px; }
  .auth-banner span { flex: 1; min-width: 180px; }

  .badge.chk { border: none; color: inherit; cursor: pointer; font: inherit; font-size: 12px; }
  .badge.chk:hover { outline: 1px solid var(--accent); }
  .badge.chk.ok { background: color-mix(in srgb, var(--ok) 22%, transparent); color: var(--ok); }
  .chk-list { list-style: none; margin: 8px 0 2px; padding: 0; display: grid; gap: 6px; cursor: default; }
  .chk-list label { display: flex; align-items: flex-start; gap: 8px; cursor: pointer; }
  .chk-list li.done span { text-decoration: line-through; color: var(--muted); }
  .chk-rows { display: grid; gap: 6px; }
  .chk-row { display: grid; grid-template-columns: auto auto 1fr auto; gap: 8px; align-items: center; }
  .chk-row.dragging { position: relative; z-index: 5; opacity: .85; background: var(--chip); border-radius: 8px; }
  .chk-drag { cursor: grab; touch-action: none; }
  .chk-drag:active { cursor: grabbing; }
  /* Runde Checkbox wie beim Task selbst (siehe .task input[type=checkbox]), nur kleiner. */
  .chk-list input[type=checkbox], .chk-row input[type=checkbox] { appearance: none; -webkit-appearance: none; -moz-appearance: none;
    width: 18px; height: 18px; min-width: 18px; min-height: 18px; max-width: 18px; max-height: 18px;
    aspect-ratio: 1; border-radius: 50%; margin: 0; padding: 0; margin-top: 1px;
    border: 2px solid var(--line); background: var(--card); display: grid; place-content: center; cursor: pointer;
    flex: none; transition: border-color .15s, background .15s; }
  .chk-list input[type=checkbox]::before, .chk-row input[type=checkbox]::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #fff; transform: scale(0); transition: transform .12s; }
  .chk-list input[type=checkbox]:checked, .chk-row input[type=checkbox]:checked { border-color: var(--accent); background: var(--accent); }
  .chk-list input[type=checkbox]:checked::before, .chk-row input[type=checkbox]:checked::before { transform: scale(1); }
  .chk-add { justify-self: start; margin-top: 6px; }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; z-index: 10; }
  dialog { max-height: calc(100dvh - 24px); overflow-y: auto; }
  .wrap { padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); padding-bottom: max(16px, env(safe-area-inset-bottom)); }

  /* Handy: größere Tippflächen, 16px in Feldern (sonst zoomt iOS beim Antippen), kompaktere Zeilen */
  @media (max-width: 520px) {
    .wrap { padding-top: max(12px, env(safe-area-inset-top)); }
    .row2 { grid-template-columns: 1fr; }
    .filters .group > b { width: 100%; }
    input, select, textarea { font-size: 16px; }
    .btn { padding: 10px 14px; }
    .btn.small { padding: 7px 12px; }
    .icon-btn { padding: 10px; }
    .task { grid-template-columns: auto auto 1fr auto; gap: 10px; padding: 10px; }
    .task input[type=checkbox] { width: 26px; height: 26px; min-width: 26px; min-height: 26px; max-width: 26px; max-height: 26px; }
    .date { width: 50px; }
    .date .day { font-size: 21px; }
    .toolbar select { flex: 1; min-width: 0; }
    header { flex-wrap: wrap; }
    .group-card h2 { flex-wrap: wrap; }
    form { padding: 16px; }
    .sw { width: 34px; height: 34px; }
    .avatar { width: 30px; height: 30px; min-width: 30px; min-height: 30px; max-width: 30px; max-height: 30px; font-size: 13px; }
    .actions { flex-wrap: wrap; }
  }
</style>
</head>

  <header>
    <a class="brand" href="#/">🏠 Haus-Tasks<span class="inbox-badge" id="inboxBadge" hidden title="Unsortierte Einträge in der Inbox"></span></a>
    <div class="sync">
      <a class="icon-btn invite" href="haushalt.html" title="Haushalt einladen">👪</a>
      <span class="dot" id="syncDot"></span><span id="syncText">…</span><button class="btn small" id="syncBtn">Sync</button>

<dialog id="dlg"><form id="form" method="dialog"></form></dialog>

<!-- Unterbau: Serienberechnung, Regeln fürs lokale Anwenden von Änderungen, Sync-Algorithmus gegen Google,
     Google-Anmeldung, Google-Calendar-Zugriff, IndexedDB-/Warteschlangen-Anbindung. Reihenfolge wichtig
     (jedes baut aufs vorige auf). -->
<script src="recurrence.js"></script>
<script src="offline-logic.js"></script>
<script src="sync-core.js"></script>
<script src="google-config.js"></script>
<script src="auth.js"></script>
<script src="gcal-remote.js"></script>
<script src="offline.js"></script>
<script>
const $ = (s, r = document) => r.querySelector(s);
const WEEKDAYS = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
const PRIO_RANK = { hoch: 0, mittel: 1, niedrig: 2 };
const ASSIGNEES = ['Caro', 'Hannes'];
const ASSIGNEE_INITIAL = { Caro: 'C', Hannes: 'H' };
const ASSIGNEE_COLOR = { Caro: '#e05297', Hannes: '#2f6fed' }; // nur fürs Avatar-Kürzel, unabhängig von Kategoriefarben
const state = {
  tasks: [], cfg: null, status: null, cats: new Set(), locs: new Set(), assignees: new Set(), showDone: false, sort: 'due', expanded: new Set(),
  lastSyncAt: null, lastSyncError: null, online: true, focusQuickCapture: false, syncHistory: [],
  todoOpen: true, laterOpen: false, // "Später" bewusst standardmäßig eingeklappt, weniger prominent als "Anstehend"
};

// Elemente ohne innerHTML bauen, damit Nutzereingaben nie als Markup gelten.
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'style') e.setAttribute('style', v);
    else if (k in e && k !== 'list') e[k] = v;
    else e.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) e.append(kid.nodeType ? kid : document.createTextNode(kid));
  return e;
}

// Reicht ausstehende lokale Änderungen sofort nach, falls die Verbindung inzwischen wieder da ist,
// ohne bei jeder einzelnen Aktion einen vollen Sync anzustoßen.
function kickSync() {
  Offline.pendingCount().then((n) => { if (n > 0) syncNow(true); });
}

// Nur tatsächlich geänderte Felder gehen in einen Patch (nicht das ganze Formular), damit eine
// Bearbeitung nie unbeachtet gebliebene Felder überschreibt, die inzwischen z. B. über ein anderes
// Gerät geändert wurden. sync-core.js führt das beim Senden konfliktsicher mit Googles aktuellem Stand zusammen.
function diffPatch(original, body) {
  const patch = {};
  for (const k of Object.keys(body)) {
    if (JSON.stringify(body[k]) !== JSON.stringify(original?.[k])) patch[k] = body[k];
  }
  return patch;
}

function toast(msg) {
  const t = h('div', { class: 'toast' }, msg);
  document.body.append(t);
  setTimeout(() => t.remove(), 3500);
}

const hex = (id) => state.cfg.colors[id]?.hex || '#9e9e9e';
const todayStr = () => new Date().toLocaleDateString('sv-SE');
const dayDiff = (iso) => Math.round((Date.parse(iso + 'T00:00:00Z') - Date.parse(todayStr() + 'T00:00:00Z')) / 864e5);
const fmtDate = (iso) => new Date(iso + 'T12:00:00').toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit', year: 'numeric' });

// Direkt antippbar: öffnet den nativen Datumswähler, ohne erst den ganzen Task öffnen zu müssen.
// Das eigentliche <input type=date> bleibt unsichtbar und dient nur als Datumswähler-Auslöser.
async function quickSetDate(t, value) {
  try {
    await Offline.mutate('task', 'update', { id: t.id, patch: { due_date: value || null } });
    await reload();
    kickSync();
  } catch (e) { toast(e.message); reload(); }
}

function dateTile(t) {
  const picker = h('input', { type: 'date', value: t.due_date || '', class: 'date-input', tabindex: -1, 'aria-hidden': 'true' });
  picker.addEventListener('click', (e) => e.stopPropagation());
  picker.addEventListener('change', () => quickSetDate(t, picker.value));
  const openPicker = (e) => { e.stopPropagation(); picker.showPicker ? picker.showPicker() : picker.focus(); };

  if (!t.due_date) {
    return h('div', { class: 'date none', title: 'Datum setzen – antippen', onclick: openPicker },
      h('span', { class: 'day' }, '–'), h('span', { class: 'mon' }, 'offen'), picker);
  }
  const d = new Date(t.due_date + 'T12:00:00');
  const diff = dayDiff(t.due_date);
  const cls = t.done ? ' done' : diff < 0 ? ' late' : diff <= 1 ? ' soon' : '';
  const yearSuffix = d.getFullYear() !== new Date().getFullYear() ? ` ’${String(d.getFullYear()).slice(2)}` : '';
  const timeLabel = t.due_time && (t.due_end_time ? `${t.due_time}–${t.due_end_time}` : t.due_time);
  return h('div', { class: 'date' + cls, title: fmtDate(t.due_date) + (t.due_time ? `, ${timeLabel} Uhr` : '') + ' – antippen zum Ändern', onclick: openPicker },
    h('span', { class: 'wd' }, d.toLocaleDateString('de-DE', { weekday: 'short' }).replace('.', '')),
    h('span', { class: 'day' }, String(d.getDate())),
    h('span', { class: 'mon' }, d.toLocaleDateString('de-DE', { month: 'short' }).replace('.', '') + yearSuffix),
    timeLabel && h('span', { class: 'time' }, timeLabel),
    picker);
}


// --- Sortieren & Filtern ---
// Tasks ohne Datum sollen ganz oben stehen (leerer String sortiert vor jedem echten Datum), nicht ganz unten.
const dueCmp = (a, b) => (a.due_date || '').localeCompare(b.due_date || '');
const prioCmp = (a, b) => PRIO_RANK[a.priority] - PRIO_RANK[b.priority];
const SORTS = {
  due: { label: 'Fälligkeit, dann Priorität', fn: (a, b) => dueCmp(a, b) || prioCmp(a, b) || a.title.localeCompare(b.title) },
  prio: { label: 'Priorität, dann Fälligkeit', fn: (a, b) => prioCmp(a, b) || dueCmp(a, b) || a.title.localeCompare(b.title) },
  title: { label: 'Titel A–Z', fn: (a, b) => a.title.localeCompare(b.title) },
  cat: { label: 'Kategorie', fn: (a, b) => (a.category || '~').localeCompare(b.category || '~') || dueCmp(a, b) },
};

function sorted(list, sortFn = SORTS[state.sort].fn) {
  const open = list.filter((t) => !t.done).sort(sortFn);
  const done = list.filter((t) => t.done).sort((a, b) => (b.done_at || '').localeCompare(a.done_at || ''));
  return state.showDone ? [...open, ...done] : open;
}

// --- Task-Zeile ---
// Bewusst schlank gehalten: nur Kreis zum Abhaken, Titel, Datum und ob es eine Checkliste gibt. Alles
// andere (Kategorie, Ort, Zuständigkeit, Priorität, Notizen, Serie) sieht man beim Öffnen des Tasks;
// über Sortierung und Filter lässt sich trotzdem gezielt einschränken.
// Löschen gibt's nur noch in der Detailansicht (siehe openForm) – hier an derselben Stelle stattdessen
// die Zuständigkeit, damit auf einen Blick sichtbar bleibt, wer den Task übernommen hat.
function taskRow(t) {
  return h('div', { class: 'task' + (t.done ? ' done' : '') },
    h('input', { type: 'checkbox', checked: t.done, title: t.done ? 'Wieder öffnen' : 'Abhaken', onchange: (e) => toggleDone(t, e.target.checked) }),
    dateTile(t),
    h('div', { class: 'main', onclick: () => openForm(t) },
      h('div', { class: 'title' }, t.title),
      h('div', { class: 'meta' }, t.checklist.length > 0 && checklistBadge(t), listMoveBadge(t)),
      state.expanded.has(t.id) && t.checklist.length > 0 && checklistView(t)),
    avatar(t.assignee));
}

// Kleiner Avatar-Kreis mit Kürzel für die Zuständigkeit, wie Asanas Zuweisungs-Icons.
function avatar(assignee, size) {
  if (!assignee) return null;
  return h('span', { class: 'avatar' + (size ? ' ' + size : ''), style: `--ac:${ASSIGNEE_COLOR[assignee] || '#888'}`, title: assignee }, ASSIGNEE_INITIAL[assignee] || '?');
}

// Checkliste („Sub-Tasks light“): Fortschritt als Badge, Klick klappt die Punkte zum direkten Abhaken auf.
function checklistBadge(t) {
  const done = t.checklist.filter((i) => i.done).length;
  const open = state.expanded.has(t.id);
  return h('button', {
    class: 'badge chk' + (done === t.checklist.length ? ' ok' : ''),
    title: open ? 'Checkliste einklappen' : 'Checkliste aufklappen',
    onclick: (e) => { e.stopPropagation(); open ? state.expanded.delete(t.id) : state.expanded.add(t.id); render(); },
  }, `☑ ${done}/${t.checklist.length} ${open ? '▴' : '▾'}`);
}

function checklistView(t) {
  return h('ul', { class: 'chk-list', onclick: (e) => e.stopPropagation() },
    t.checklist.map((item, i) => h('li', { class: item.done ? 'done' : '' },
      h('label', {}, h('input', { type: 'checkbox', checked: item.done, onchange: (e) => toggleItem(t, i, e.target.checked) }), h('span', {}, item.text)))));
}

// Checkliste wird als volles Array gesendet (nicht nur der eine geänderte Punkt) – wird schnell
// hintereinander mehrfach abgehakt, würde ein zweiter Klick sonst noch mit dem Stand von VOR dem ersten
// rechnen und dessen gerade gesetztes Häkchen beim Senden wieder rückgängig machen (stiller
// Datenverlust, genau das war vermutlich die Ursache für den abweichenden Checklisten-Stand). Eine
// Warteschlange pro Task serialisiert die Klicks: der nächste Toggle rechnet erst, wenn der vorherige
// wirklich fertig gespeichert ist.
const toggleQueue = new Map();
function toggleItem(t, index, done) {
  const run = async () => {
    try {
      const current = state.tasks.find((x) => x.id === t.id) || t;
      const checklist = current.checklist.map((item, i) => (i === index ? { ...item, done } : item));
      const updated = await Offline.mutate('task', 'update', { id: t.id, patch: { checklist } });
      state.tasks = state.tasks.map((x) => (x.id === updated.id ? updated : x));
      render();
      kickSync();
    } catch (e) { toast(e.message); reload(); }
  };
  const next = (toggleQueue.get(t.id) || Promise.resolve()).then(run);
  toggleQueue.set(t.id, next.catch(() => {}));
  return next;
}

async function toggleDone(t, done) {
  try {
    await Offline.mutate('task', 'done', { id: t.id, done });
    await reload();
    kickSync();
  } catch (e) { toast(e.message); reload(); }
}

// Schnelles Umsortieren zwischen "To Do" und "Später", direkt in der Zeile statt über die Detailansicht.
function listMoveBadge(t) {
  const bucket = t.bucket || 'todo';
  return bucket === 'later'
    ? h('button', { class: 'badge list-move', title: 'Zu To Do verschieben', onclick: (e) => { e.stopPropagation(); moveBucket(t, 'todo'); } }, '↑ To Do')
    : h('button', { class: 'badge list-move', title: 'Auf Später verschieben', onclick: (e) => { e.stopPropagation(); moveBucket(t, 'later'); } }, '→ Später');
}

async function moveBucket(t, bucket) {
  try {
    await Offline.mutate('task', 'update', { id: t.id, patch: { bucket } });
    await reload();
    kickSync();
  } catch (e) { toast(e.message); reload(); }
}

async function removeTask(t) {
  if (!confirm(`„${t.title}“ löschen? Der Kalendereintrag in Google wird ebenfalls gelöscht.`)) return;
  try {
    await Offline.mutate('task', 'delete', { id: t.id });
    await reload();
    kickSync();
  } catch (e) { toast(e.message); }
}

function taskList(list, emptyText, sortFn) {
  const rows = sorted(list, sortFn);
  return h('div', { class: 'list' }, rows.length ? rows.map(taskRow) : h('div', { class: 'empty' }, emptyText));
}

// --- Seiten ---
function doneToggle() {
  return h('label', {}, h('input', { type: 'checkbox', checked: state.showDone, onchange: (e) => { state.showDone = e.target.checked; render(); } }), ' Erledigte anzeigen');
}

function chipGroup(label, names, set, manageHref) {
  return h('div', { class: 'group' },
    h('b', {}, label, manageHref && h('a', { class: 'manage-link', href: manageHref, title: `${label} verwalten` }, ' ✎')),
    names.map((n) => h('button', { class: 'chip' + (set.has(n) ? ' on' : ''), onclick: () => { set.has(n) ? set.delete(n) : set.add(n); render(); } }, n)));
}

// --- Schnellerfassung & Inbox ---
// GTD-Prinzip: erfassen ohne nachzudenken (nur Titel, Enter), einsortieren kommt danach. Der Fokus bleibt
// nach dem Speichern im Feld, damit man mehrere Ideen direkt hintereinander eintippen kann – da render()
// die ganze Seite neu aufbaut, muss der Fokus über ein Flag in state gezielt wiederhergestellt werden.
function quickCaptureInput() {
  const input = h('input', {
    type: 'text', class: 'quick-capture', placeholder: 'Idee oder Task eintippen, Enter zum Speichern …',
    onkeydown: async (e) => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      const title = input.value.trim();
      if (!title) return;
      try {
        await Offline.mutate('task', 'create', { input: { title, bucket: 'inbox' } });
        state.focusQuickCapture = true;
        await reload();
        kickSync();
      } catch (err) { toast(err.message); }
    },
  });
  if (state.focusQuickCapture) {
    state.focusQuickCapture = false;
    queueMicrotask(() => input.focus());
  }
  return input;
}

async function triageInbox(t, patch) {
  try {
    await Offline.mutate('task', 'update', { id: t.id, patch });
    await reload();
    kickSync();
  } catch (e) { toast(e.message); reload(); }
}

// 2-Minuten-Regel: Kleinkram direkt aus der Inbox heraus erledigen, ohne den Umweg über "To Do".
async function completeFromInbox(t) {
  try {
    await Offline.mutate('task', 'update', { id: t.id, patch: { bucket: 'todo' } });
    await Offline.mutate('task', 'done', { id: t.id, done: true });
    await reload();
    kickSync();
  } catch (e) { toast(e.message); reload(); }
}

function inboxRow(t) {
  return h('div', { class: 'inbox-row' },
    h('span', { class: 'title', onclick: () => openForm(t) }, t.title),
    h('div', { class: 'actions' },
      h('button', { class: 'badge list-move ok', title: '2-Minuten-Regel: gleich erledigt', onclick: () => completeFromInbox(t) }, '✓'),
      h('button', { class: 'badge list-move', title: 'Zu To Do', onclick: () => triageInbox(t, { bucket: 'todo' }) }, 'To Do'),
      h('button', { class: 'badge list-move', title: 'Auf Später', onclick: () => triageInbox(t, { bucket: 'later' }) }, 'Später'),
      h('button', { class: 'icon-btn', title: 'Verwerfen', onclick: () => removeTask(t) }, '✕')));
}

function inboxSection() {
  const items = state.tasks.filter((t) => (t.bucket || 'todo') === 'inbox');
  if (!items.length) return null;
  return h('div', { class: 'inbox-list' }, items.map(inboxRow));
}

// Klappbare Abschnitts-Überschrift – hält "Später" bewusst unauffällig (standardmäßig eingeklappt),
// statt wie zuvor als eigener, prominenter Navigationsblock ganz oben.
function sectionHeader(title, count, open, onToggle) {
  return h('div', { class: 'section-header', onclick: onToggle },
    h('span', { class: 'toggle-icon' }, open ? '−' : '+'),
    h('strong', {}, `${title} (${count})`));
}

function homePage() {
  const openCount = state.tasks.filter((t) => (t.bucket || 'todo') === 'todo' && !t.done).length;
  const laterList = state.tasks.filter((t) => (t.bucket || 'todo') === 'later');
  const laterCount = laterList.filter((t) => !t.done).length;
  const filtered = state.tasks.filter((t) =>
    (t.bucket || 'todo') === 'todo' &&
    (!state.cats.size || state.cats.has(t.category)) &&
    (!state.locs.size || state.locs.has(t.location)) &&
    (!state.assignees.size || state.assignees.has(t.assignee)));
  return h('div', {},
    quickCaptureInput(),
    inboxSection(),
    h('div', { class: 'section' },
      sectionHeader('Anstehend', openCount, state.todoOpen, () => { state.todoOpen = !state.todoOpen; render(); }),
      state.todoOpen && h('div', {},
        h('div', { class: 'toolbar' },
          h('span', { style: 'flex:1' }),
          h('label', {}, 'Sortierung '),
          h('select', { onchange: (e) => { state.sort = e.target.value; render(); } },
            Object.entries(SORTS).map(([k, s]) => h('option', { value: k, selected: k === state.sort }, s.label))),
          doneToggle()),
        h('div', { class: 'filters' },
          chipGroup('Kategorie', Object.keys(state.cfg.categories), state.cats, '#/kategorien'),
          chipGroup('Ort', state.cfg.locations, state.locs, '#/orte'),
          chipGroup('Wer', ASSIGNEES, state.assignees)),
        taskList(filtered, state.tasks.length ? 'Keine Tasks für diese Filter.' : 'Noch keine Tasks. Leg den ersten an!'))),
    h('div', { class: 'section' },
      sectionHeader('Später', laterCount, state.laterOpen, () => { state.laterOpen = !state.laterOpen; render(); }),
      state.laterOpen && taskList(laterList, 'Nichts auf Später verschoben.', byCreatedAsc)));
}

// Kategorien und Orte: gleiche Seite, beide mit Anlegen, Umbenennen und Löschen.
const GROUP_TEXT = {
  category: { newBtn: '＋ Neue Kategorie', none: 'Ohne Kategorie' },
  location: { newBtn: '＋ Neuer Ort', none: 'Ohne Ort' },
};

function groupPage(title, names, key, colorOf) {
  const groups = [...names, null].map((name) => ({ name, list: state.tasks.filter((t) => (t[key] || null) === name) }))
    .filter((g) => g.name !== null || g.list.length);
  return h('div', {},
    h('a', { class: 'backlink', href: '#/' }, '← Zurück'),
    h('h1', {}, title),
    h('div', { class: 'toolbar' },
      h('button', { class: 'btn primary', onclick: () => openGroupForm(key, null) }, GROUP_TEXT[key].newBtn),
      h('span', { style: 'flex:1' }), doneToggle()),
    groups.map((g) => h('section', { class: 'group-card', style: `--c:${colorOf(g.name)}` },
      h('h2', {}, h('span', { class: 'swatch' }), g.name || GROUP_TEXT[key].none,
        h('span', { class: 'count' }, `${g.list.filter((t) => !t.done).length} offen`),
        g.name && h('button', { class: 'btn small', style: 'margin-left:auto', onclick: () => openGroupForm(key, g.name) }, '✎ Bearbeiten')),
      taskList(g.list, 'Keine offenen Tasks.'))));
}

// "Später"-Liste: bewusst nach Anlagedatum sortiert (älteste zuerst), nicht nach dem globalen Sortier-
// Dropdown der Startseite – damit ältere, sonst leicht vergessene Punkte beim gelegentlichen Reinschauen
// automatisch nach oben wandern (eine Art Mini-Weekly-Review).
const byCreatedAsc = (a, b) => (a.created_at || '').localeCompare(b.created_at || '');

// Debug-Ansicht (#/debug): zeigt rohe lokale Daten, unabhängig von jeder Anzeige-/Filterlogik der
// normalen Seiten – fürs Aufspüren von Sync-Problemen, bei denen die App selbst "erfolgreich" meldet,
// der tatsächliche Datenstand aber nicht stimmt. Lädt asynchron, deshalb außerhalb des normalen,
// synchronen render()-Seitenwechsels.
function renderDebugPage(view) {
  const search = h('input', { type: 'text', placeholder: 'Titel durchsuchen …', style: 'width:100%;box-sizing:border-box;margin-bottom:10px;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);' });
  const pre = (content) => h('pre', { style: 'white-space:pre-wrap;word-break:break-word;font-size:12px;background:var(--chip);padding:8px;border-radius:8px;margin:0 0 16px;' }, content);
  const results = h('div', {});
  const outboxBox = pre('Lädt …');
  const historyBox = h('div', {});
  const paintHistory = () => historyBox.replaceChildren(
    ...(state.syncHistory.length ? state.syncHistory.map((r) => pre(JSON.stringify(r, null, 2))) : [pre('(noch kein Sync in dieser Sitzung – einmal auf „Sync“ tippen)')]));

  async function paint() {
    const raw = await Offline.getRawTasks();
    const q = search.value.trim().toLowerCase();
    const matches = q ? raw.filter((t) => t.title.toLowerCase().includes(q)) : [];
    results.replaceChildren(...matches.map((t) => pre(JSON.stringify(t, null, 2))));
    const outbox = await Offline.getOutbox();
    outboxBox.textContent = outbox.length ? JSON.stringify(outbox, null, 2) : '(leer – keine wartenden Änderungen)';
    paintHistory();
  }
  search.addEventListener('input', paint);
  const refreshBtn = h('button', { type: 'button', class: 'btn small', style: 'margin-bottom:10px;', onclick: paint }, '🔄 Aktualisieren');

  view.replaceChildren(h('div', {},
    h('a', { class: 'backlink', href: '#/' }, '← Zurück'),
    h('h1', {}, 'Debug'),
    refreshBtn,
    h('h2', {}, 'Warteschlange (Outbox) – wartende, noch nicht gesendete Änderungen'), outboxBox,
    h('h2', {}, 'Sync-Verlauf dieser Sitzung (neueste zuerst)'), historyBox,
    h('h2', {}, 'Task-Rohdaten durchsuchen'), search, results));
  paint();
}

function render() {
  const route = location.hash.replace(/^#\/?/, '');
  const view = $('#view');
  if (!state.cfg) return;
  if (route === 'debug') {
    renderDebugPage(view);
  } else {
    view.replaceChildren(
      route === 'kategorien' ? groupPage('Kategorien', Object.keys(state.cfg.categories), 'category', (n) => n ? hex(state.cfg.categories[n]) : '#9e9e9e')
      : route === 'orte' ? groupPage('Orte', state.cfg.locations, 'location', () => 'var(--accent)')
      : homePage());
  }
  const inboxCount = state.tasks.filter((t) => (t.bucket || 'todo') === 'inbox').length;
  const badge = $('#inboxBadge');
  badge.hidden = inboxCount === 0;
  badge.textContent = inboxCount;
  const s = state.status;
  $('#syncDot').className = 'dot ' + (!s || s.offline ? '' : state.lastSyncError ? 'err' : 'ok');
  $('#syncText').textContent = !s ? '' : s.offline ? `Nicht erreichbar${s.pending ? ` · ${s.pending} Änderung(en) warten` : ''}`
    : state.lastSyncError ? 'Sync-Fehler'
    : state.lastSyncAt ? 'Sync ' + state.lastSyncAt.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })
    : 'Noch nicht synchronisiert';
  $('#syncText').title = state.lastSyncError || '';
}

// --- Formular ---
// Farbwahl aus Googles Event-Farben. Graphit (8) ist für „erledigt“ reserviert, bleibt aber wählbar, wenn ein Task sie schon hat.
function makeSwatches(initial, onPick) {
  let color = initial;
  const el = h('div', { class: 'swatches' });
  const paint = () => el.replaceChildren(...Object.entries(state.cfg.colors).filter(([id]) => id !== '8' || color === '8').map(([id, c]) =>
    h('button', { type: 'button', class: 'sw' + (id === color ? ' on' : ''), style: `--c:${c.hex}`, title: c.name, onclick: () => { color = id; paint(); onPick?.(); } })));
  paint();
  return { el, get: () => color, set: (id) => { color = id; paint(); } };
}

// Zuständigkeit: Avatar-Kreise zum Antippen, plus „niemand“. Gleiche Bauweise wie makeSwatches.
function makeAssigneePicker(initial) {
  let value = initial || null;
  const el = h('div', { class: 'avatar-picker' });
  const paint = () => el.replaceChildren(
    ...[null, ...ASSIGNEES].map((a) => h('button', {
      type: 'button', class: 'avatar-btn' + (a === value ? ' on' : ''), onclick: () => { value = a; paint(); },
    }, a ? avatar(a) : h('span', { class: 'avatar sm', style: '--ac:var(--line)' }, '–'), a || 'Niemand')));
  paint();
  return { el, get: () => value };
}

const GROUP_KIND = {
  category: { cfgKey: 'categories', filter: () => state.cats, singular: 'Kategorie', article: 'Neue', placeholder: 'z. B. Reinigung' },
  location: { cfgKey: 'locations', filter: () => state.locs, singular: 'Ort', article: 'Neuer', placeholder: 'z. B. Carport' },
};

// Anlegen/Bearbeiten/Löschen einer Kategorie (mit Farbe) oder eines Ortes.
function openGroupForm(kind, name) {
  const k = GROUP_KIND[kind];
  const isNew = name == null;
  const nameInput = h('input', { type: 'text', value: name || '', required: true, maxLength: 40, placeholder: k.placeholder });
  const picker = kind === 'category' ? makeSwatches(isNew ? '9' : state.cfg.categories[name]) : null;
  const err = h('div', { class: 'error' });
  const form = $('#form');

  // Neue Liste übernehmen und Filter bereinigen, die auf einen umbenannten/gelöschten Namen zeigten.
  const applyList = (list) => {
    state.cfg[k.cfgKey] = list;
    const names = Array.isArray(list) ? list : Object.keys(list);
    for (const n of [...k.filter()]) if (!names.includes(n)) k.filter().delete(n);
  };

  form.onsubmit = async (e) => {
    e.preventDefault();
    try {
      const body = kind === 'category' ? { name: nameInput.value, color: picker.get() } : { name: nameInput.value };
      // Nur die tatsächlich geänderten Felder senden, damit z. B. ein reines Umfärben nicht versehentlich
      // einen zwischenzeitlich anderswo geänderten Namen zurücksetzt (und umgekehrt).
      const original = kind === 'category' ? { name, color: state.cfg.categories[name] } : { name };
      const payload = isNew ? body : diffPatch(original, body);
      const list = await Offline.mutate(kind, isNew ? 'create' : 'update', isNew ? payload : { id: name, patch: payload });
      applyList(list);
      $('#dlg').close();
      await reload();
      kickSync();
    } catch (ex) { err.textContent = ex.message; }
  };

  async function remove() {
    const n = state.tasks.filter((t) => t[kind] === name).length;
    if (!confirm(`${k.singular} „${name}“ löschen?${n ? ` Die ${n} Tasks bleiben erhalten, haben danach aber keine ${k.singular === 'Ort' ? 'Ortsangabe' : 'Kategorie'}.` : ''}`)) return;
    try {
      const list = await Offline.mutate(kind, 'delete', { id: name });
      applyList(list);
      $('#dlg').close();
      await reload();
      kickSync();
    } catch (ex) { err.textContent = ex.message; }
  }

  form.replaceChildren(
    h('h3', {}, isNew ? `${k.article} ${k.singular}` : `${k.singular} bearbeiten`),
    h('div', { class: 'field' }, h('label', {}, 'Name'), nameInput),
    picker && h('div', { class: 'field' }, h('label', {}, 'Standardfarbe für neue Tasks'), picker.el),
    !isNew && h('div', { class: 'hint' }, (kind === 'category' ? 'Bestehende Tasks behalten ihre Farbe. ' : '') + 'Beim Umbenennen wandern die Tasks mit.'),
    err,
    h('div', { class: 'actions' },
      isNew ? h('span') : h('button', { type: 'button', class: 'btn danger', onclick: remove }, 'Löschen'),
      h('div', { class: 'right' },
        h('button', { type: 'button', class: 'btn', onclick: () => $('#dlg').close() }, 'Abbrechen'),
        h('button', { type: 'submit', class: 'btn primary' }, 'Speichern'))));
  $('#dlg').showModal();
  nameInput.focus();
}

// Editor für die Checkliste im Formular. Enter legt einen neuen Punkt an, Rücktaste in einem leeren Punkt entfernt ihn,
// eingefügter mehrzeiliger Text (auch mit „-“, „*“ oder „[ ]“ davor) wird auf mehrere Punkte verteilt.
function makeChecklistEditor(initial) {
  const rows = h('div', { class: 'chk-rows' });

  // Reihenfolge wird rein über die DOM-Reihenfolge der Zeilen gesteuert (siehe get()). Das Umsortieren
  // selbst läuft über Pointer-Events (nicht die native HTML5-Drag-and-Drop-API), weil die auf dem Handy
  // nicht zuverlässig funktioniert – Pointer-Events laufen auf Maus und Touch gleichermaßen.
  const addRow = (text = '', done = false, { focus = false, after = null } = {}) => {
    const cb = h('input', { type: 'checkbox', checked: done, title: 'Erledigt' });
    const input = h('input', { type: 'text', value: text, placeholder: 'Punkt …', maxLength: 200 });
    const handle = h('button', { type: 'button', class: 'icon-btn chk-drag', title: 'Ziehen zum Umsortieren' }, '⠿');
    const row = h('div', { class: 'chk-row' }, handle, cb, input,
      h('button', { type: 'button', class: 'icon-btn', title: 'Punkt entfernen', onclick: () => row.remove() }, '✕'));

    let dragging = false;
    let startY = 0;
    const onMove = (e) => {
      if (!dragging) return;
      const deltaY = e.clientY - startY;
      row.style.transform = `translateY(${deltaY}px)`;
      const prev = row.previousElementSibling;
      const next = row.nextElementSibling;
      if (prev) {
        const r = prev.getBoundingClientRect();
        if (e.clientY < r.top + r.height / 2) { rows.insertBefore(row, prev); startY = e.clientY; row.style.transform = ''; return; }
      }
      if (next) {
        const r = next.getBoundingClientRect();
        if (e.clientY > r.top + r.height / 2) { rows.insertBefore(next, row); startY = e.clientY; row.style.transform = ''; }
      }
    };
    const onEnd = (e) => {
      if (!dragging) return;
      dragging = false;
      row.classList.remove('dragging');
      row.style.transform = '';
      try { handle.releasePointerCapture(e.pointerId); } catch { /* schon losgelassen */ }
    };
    handle.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      dragging = true;
      startY = e.clientY;
      row.classList.add('dragging');
      handle.setPointerCapture(e.pointerId);
    });
    handle.addEventListener('pointermove', onMove);
    handle.addEventListener('pointerup', onEnd);
    handle.addEventListener('pointercancel', onEnd);

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault(); // sonst würde das Formular abgeschickt
        if (input.value.trim()) addRow('', false, { focus: true, after: row });
      } else if (e.key === 'Backspace' && !input.value) {
        e.preventDefault();
        const prev = row.previousElementSibling;
        row.remove();
        prev?.querySelector('input[type=text]').focus();
      }
    });
    input.addEventListener('paste', (e) => {
      const pasted = e.clipboardData?.getData('text') || '';
      if (input.value || !/\r?\n/.test(pasted)) return; // nur in leere Zeilen verteilen
      e.preventDefault();
      const lines = pasted.split(/\r?\n/).map((s) => s.replace(/^\s*(?:[-*•]|\[[ xX]?\])\s*/, '').trim()).filter(Boolean);
      input.value = lines[0].slice(0, 200);
      let last = row;
      for (const line of lines.slice(1)) last = addRow(line.slice(0, 200), false, { after: last });
    });

    after ? after.after(row) : rows.append(row);
    if (focus) input.focus();
    return row;
  };

  initial.forEach((i) => addRow(i.text, i.done));
  const el = h('div', {}, rows,
    h('button', { type: 'button', class: 'btn small chk-add', onclick: () => addRow('', false, { focus: true }) }, '＋ Punkt hinzufügen'));
  const get = () => [...rows.children]
    .map((r) => ({ text: r.querySelector('input[type=text]').value.trim(), done: r.querySelector('input[type=checkbox]').checked }))
    .filter((i) => i.text);
  return { el, get };
}

function openForm(task) {
  const cfg = state.cfg;
  const t = task || { title: '', due_date: '', due_time: '', due_end_time: '', category: '', location: '', assignee: null, priority: 'mittel', color: '9', notes: '', recurrence: null };
  let colorTouched = !!task;
  const r = t.recurrence;

  const title = h('input', { type: 'text', value: t.title, required: true, placeholder: 'z. B. Steckdose im Flur setzen' });
  const date = h('input', { type: 'date', value: t.due_date || '' });
  // Nur sinnvoll mit Datum – z. B. wenn aus einer Vorbereitung ein echter Termin mit fixer Zeit wird.
  const time = h('input', { type: 'time', value: t.due_time || '', disabled: !t.due_date });
  // Endzeit wiederum nur sinnvoll mit Startzeit – ohne eigene Angabe gilt eine Stunde als Vorgabe (siehe
  // eventBody()), muss hier also nicht zwingend ausgefüllt werden.
  const endTime = h('input', { type: 'time', value: t.due_end_time || '', disabled: !t.due_time, placeholder: '+1 Std.' });
  const syncTimeFields = () => {
    time.disabled = !date.value;
    if (!date.value) time.value = '';
    endTime.disabled = !time.value;
    if (!time.value) endTime.value = '';
  };
  date.addEventListener('change', syncTimeFields);
  time.addEventListener('change', syncTimeFields);
  const cat = h('select', {}, h('option', { value: '' }, '– keine –'), Object.keys(cfg.categories).map((c) => h('option', { value: c, selected: c === t.category }, c)));
  const loc = h('select', {}, h('option', { value: '' }, '– keiner –'), cfg.locations.map((l) => h('option', { value: l, selected: l === t.location }, l)));
  const prio = h('select', {}, cfg.priorities.map((p) => h('option', { value: p, selected: p === t.priority }, p)));
  const who = makeAssigneePicker(t.assignee);
  const notes = h('textarea', { rows: 3 }, t.notes || '');
  notes.value = t.notes || '';
  const chk = makeChecklistEditor(t.checklist || []);

  const picker = makeSwatches(t.color, () => { colorTouched = true; });
  cat.addEventListener('change', () => { if (!colorTouched && cat.value) picker.set(cfg.categories[cat.value]); });

  // Serie
  const recType = h('select', {},
    [['', 'Keine Wiederholung'], ['weekly', 'Wöchentlich (alle n Wochen)'], ['monthly_weekday', 'Monatlich: n-ter Wochentag'], ['monthly_day', 'Monatlich: Tag x'], ['yearly', 'Jährlich (alle n Jahre)']]
      .map(([v, l]) => h('option', { value: v, selected: v === (r?.type || '') }, l)));
  const interval = h('input', { type: 'number', min: 1, max: 120, value: r?.interval || 1 });
  const nth = h('select', {}, [[1, '1.'], [2, '2.'], [3, '3.'], [4, '4.'], [-1, 'letzten']].map(([v, l]) => h('option', { value: v, selected: v === (r?.nth ?? 1) }, l)));
  const wd = h('select', {}, [1, 2, 3, 4, 5, 6, 0].map((i) => h('option', { value: i, selected: i === (r?.weekday ?? 1) }, WEEKDAYS[i])));
  const mday = h('input', { type: 'number', min: 1, max: 31, value: r?.day || 1 });
  const recOpts = h('div', { class: 'inline' });
  const paintRec = () => {
    const ty = recType.value;
    recOpts.replaceChildren(...(ty === 'weekly' ? ['Alle ', interval, ' Woche(n)']
      : ty === 'monthly_weekday' ? ['Alle ', interval, ' Monat(e): jeden ', nth, wd]
      : ty === 'monthly_day' ? ['Alle ', interval, ' Monat(e) am ', mday, '. Tag']
      : ty === 'yearly' ? ['Alle ', interval, ' Jahr(e) am Datum des Tasks'] : []));
  };
  recType.addEventListener('change', () => {
    if (date.value && recType.value === 'monthly_weekday' && !task?.recurrence) { const d = new Date(date.value + 'T12:00:00'); wd.value = d.getDay(); nth.value = Math.min(Math.ceil(d.getDate() / 7), 4); }
    if (date.value && recType.value === 'monthly_day') mday.value = Number(date.value.slice(8));
    paintRec();
  });
  paintRec();

  const err = h('div', { class: 'error' });
  const form = $('#form');

  async function save(e) {
    e.preventDefault();
    const ty = recType.value;
    const iv = Math.max(1, Number(interval.value) || 1);
    const recurrence = !ty ? null : ty === 'weekly' ? { type: ty, interval: iv }
      : ty === 'monthly_weekday' ? { type: ty, interval: iv, nth: Number(nth.value), weekday: Number(wd.value) }
      : ty === 'monthly_day' ? { type: ty, interval: iv, day: Number(mday.value) } : { type: ty, interval: iv };
    const body = { title: title.value, due_date: date.value || null, due_time: date.value && time.value ? time.value : null,
      due_end_time: date.value && time.value && endTime.value ? endTime.value : null,
      category: cat.value || null, location: loc.value || null,
      assignee: who.get(), priority: prio.value, color: picker.get(), notes: notes.value, checklist: chk.get(), recurrence };
    // Bei einer Bearbeitung nur die tatsächlich geänderten Felder senden (siehe diffPatch); beim Neuanlegen
    // gibt es noch keine Vorversion, da geht das komplette Formular raus.
    const payload = task ? diffPatch(task, body) : body;
    try {
      await Offline.mutate('task', task ? 'update' : 'create', task ? { id: task.id, patch: payload } : { input: payload });
      $('#dlg').close();
      await reload();
      kickSync();
    } catch (ex) { err.textContent = ex.message; }
  }

  // Diagnose-Zeile: hilft bei der Fehlersuche, wenn sich ein Task zwischen Geräten unterscheidet (z. B.
  // zeigt ein abweichender "Stand" bei gleicher Event-ID sofort, dass ein Gerät eine ältere Version lokal
  // hat statt gerade erst zu synchronisieren). Rein informativ, nichts davon wird gespeichert.
  const syncInfo = task && h('div', { class: 'sync-info' },
    `Sync-Stand: ${task.google_event_id ? task.google_event_id.slice(0, 10) + '…' : '– noch nie synchronisiert –'}` +
    (task.google_updated ? ` · ${new Date(task.google_updated).toLocaleString('de-DE')}` : ''));

  const field = (label, ...ctl) => h('div', { class: 'field' }, h('label', {}, label), ...ctl);
  form.onsubmit = save;
  form.replaceChildren(
    h('h3', {}, task ? 'Task bearbeiten' : 'Neuer Task'),
    syncInfo,
    field('Titel', title),
    h('div', { class: 'row2' }, field('Datum (leer = nur in der App)', date), field('Uhrzeit (optional)', time)),
    field('Ende (optional, sonst +1 Std.)', endTime),
    field('Wiederholung', recType),
    recOpts,
    h('div', { class: 'row2' }, field('Kategorie', cat), field('Ort', loc)),
    field('Zuständigkeit', who.el),
    h('div', { class: 'row2' }, field('Priorität', prio), field('Farbe', picker.el)),
    field('Notizen', notes),
    field('Checkliste (Enter = nächster Punkt, mehrzeiligen Text einfügen = mehrere Punkte)', chk.el),
    err,
    h('div', { class: 'actions' },
      task ? h('button', { type: 'button', class: 'btn danger', onclick: async () => { $('#dlg').close(); await removeTask(task); } }, 'Löschen') : h('span'),
      h('div', { class: 'right' },
        h('button', { type: 'button', class: 'btn', onclick: () => $('#dlg').close() }, 'Abbrechen'),
        h('button', { type: 'submit', class: 'btn primary' }, 'Speichern'))));
  $('#dlg').showModal();
  title.focus();
}

// --- Feste App-Konstanten: liegen bei niemandem auf einem Server, gelten für alle Installationen gleich ---
const PRIORITIES = ['hoch', 'mittel', 'niedrig'];
const COLORS = {
  1: { name: 'Lavendel', hex: '#a4bdfc' }, 2: { name: 'Salbei', hex: '#7ae7bf' }, 3: { name: 'Weintraube', hex: '#dbadff' },
  4: { name: 'Flamingo', hex: '#ff887c' }, 5: { name: 'Banane', hex: '#fbd75b' }, 6: { name: 'Mandarine', hex: '#ffb878' },
  7: { name: 'Pfau', hex: '#46d6db' }, 8: { name: 'Graphit', hex: '#9e9e9e' }, 9: { name: 'Heidelbeere', hex: '#5484ed' },
  10: { name: 'Basilikum', hex: '#51b749' }, 11: { name: 'Tomate', hex: '#dc2127' },
};
const DEFAULT_CATEGORIES = { Elektrik: '5', Installation: '7', Innenausbau: '6', Möbel: '3', Garten: '10', Wartung: '9' };
const DEFAULT_LOCATIONS = ['Garten', 'Wohnraum', 'Küche', 'Sanitär', 'Halle', 'Keller', 'Dachboden'];

// --- Laden & Sync ---
async function computeStatus() {
  const pending = await Offline.pendingCount();
  return { offline: !state.online, pending };
}

async function reload() {
  state.tasks = await Offline.getCachedTasks();
  state.status = await computeStatus();
  render();
}

// Erneute Anmeldung mitten in der Nutzung: schmaler Hinweis statt die ganze Ansicht zu ersetzen, damit
// die zwischengespeicherten Tasks sichtbar und bedienbar bleiben (sie liegen ja lokal, siehe Offline.*).
function showAuthBanner() {
  const el = $('#authBanner');
  if (el.childElementCount) return; // schon sichtbar
  const btn = h('button', {
    class: 'btn small primary',
    onclick: async () => {
      btn.disabled = true;
      try {
        await Auth.signIn(); // echter Klick: Google zeigt bei Bedarf den Anmeldebildschirm
        el.replaceChildren();
        syncNow(true);
      } catch (e) { toast(e.message); btn.disabled = false; }
    },
  }, 'Jetzt anmelden');
  el.replaceChildren(h('div', { class: 'auth-banner' }, h('span', {}, '🔒 Bei Google abgemeldet – zum Weitersynchronisieren erneut anmelden.'), btn));
}
function hideAuthBanner() { $('#authBanner').replaceChildren(); }

let syncing = false;
// Vollständiger Abgleich mit dem geteilten Google-Kalender: ausstehende lokale Änderungen senden,
// Änderungen von dort abholen. Wird durch den Sync-Button, beim Öffnen, beim Wiederverbinden, beim
// Sichtbarwerden des Tabs und alle 5 Minuten aufgerufen.
async function syncNow(silent) {
  if (syncing) return;
  syncing = true;
  $('#syncBtn').disabled = true;
  if (!Offline.ping()) {
    // Lokal schon klar: nicht angemeldet oder noch kein Kalender eingerichtet – kein Sync-Versuch nötig.
    state.online = true; // kein Verbindungsproblem, sondern fehlende Einrichtung
    state.status = await computeStatus();
    if (!silent) toast('Nicht angemeldet oder noch kein Kalender eingerichtet.');
  } else {
    try {
      // Zuerst, noch bevor irgendwelche IndexedDB-Zugriffe laufen: einen gültigen Token sicherstellen.
      // So bleibt bei einem Klick auf den Sync-Button möglichst viel von der „echten Nutzer-Interaktion“
      // erhalten, auf die sich Googles eigene, stille Anmelde-Erneuerung verlässt (siehe deren
      // Dokumentation: requestAccessToken ist für Aufrufe aus einer Nutzer-Aktion gedacht, nicht für
      // reine Hintergrundaufrufe – ein automatischer Sync alle 5 Minuten hat diesen Vorteil naturgemäß nicht).
      await Auth.getToken();
      hideAuthBanner();
      const r = await Offline.sync();
      // Für die Debug-Ansicht (#/debug): eine kleine Verlaufsliste statt nur des allerletzten Ergebnisses –
      // sonst überschreibt ein harmloser Folge-Sync (z. B. durch den 5-Minuten-Timer) genau den
      // interessanten, fehlgeschlagenen Versuch direkt wieder, bevor man nachsehen kann.
      state.syncHistory = [{ at: new Date().toISOString(), ...r }, ...state.syncHistory].slice(0, 10);
      state.online = true;
      const cfg = await Offline.getConfig();
      if (cfg) state.cfg = { ...state.cfg, categories: cfg.categories, locations: cfg.locations };
      state.tasks = await Offline.getCachedTasks();
      state.lastSyncError = r.aborted ? 'Verbindung verloren' : null;
      if (!r.aborted) state.lastSyncAt = new Date();
      // Diese beiden sind wichtig genug, um auch bei einem stillen Hintergrund-Sync angezeigt zu werden:
      // eine dauerhaft abgelehnte Änderung (verworfen, sonst unbemerkt verloren) und ein erkannter
      // Zusammenstoß mit einer zwischenzeitlichen Fremdänderung (nichts verloren, aber erwähnenswert).
      if (r.failed.length) toast(`⚠ ${r.failed.length} lokale Änderung(en) konnten nicht übernommen werden: ${r.failed[0].error}`);
      if (r.clashes.length) {
        const names = [...new Set(r.clashes.map((c) => c.title))].join(', ');
        toast(`ℹ Bei „${names}“ gab es während der Offline-Zeit auch eine Änderung auf einem anderen Gerät – geprüft, nichts ging verloren.`);
      }
      if (!silent) {
        if (r.aborted) toast('Verbindung während der Übertragung verloren, der Rest folgt automatisch.');
        else toast(`Sync fertig: ${r.pulled} übernommen, ${r.pushed} gesendet.`);
      }
    } catch (e) {
      if (e.authRequired) {
        // Mitten in der Nutzung abgemeldet: nur ein Hinweis-Banner, die zwischengespeicherte Ansicht
        // bleibt stehen. Nur beim allerersten Laden (noch gar keine Daten da) macht die volle
        // Anmeldeseite Sinn – das entscheidet boot() für sich, hier reicht immer das Banner.
        state.online = true;
        showAuthBanner();
      } else if (!e.status) {
        // Kein HTTP-Status: der Aufruf ist schon vor einer Antwort gescheitert, also vermutlich keine
        // Verbindung – kein alarmierender Fehler, die Änderungen bleiben einfach lokal liegen.
        state.online = false;
        if (!silent) toast(`Nicht erreichbar. ${await Offline.pendingCount()} Änderung(en) werden lokal aufbewahrt.`);
      } else {
        state.online = true;
        state.lastSyncError = e.message;
        if (!silent) toast(e.message);
      }
    }
    state.status = await computeStatus();
  }
  syncing = false;
  $('#syncBtn').disabled = false;
  render();
}

$('#syncBtn').onclick = () => syncNow(false);
$('#signOutBtn').onclick = () => { if (confirm('Bei Google abmelden?')) { Auth.signOut(); renderSignIn(); } };
window.addEventListener('hashchange', render);
window.addEventListener('online', () => syncNow(true));
document.addEventListener('visibilitychange', () => { if (!document.hidden) syncNow(true); });
setInterval(() => { if (!document.hidden && !$('#dlg').open) syncNow(true); }, 5 * 60 * 1000);

if ('serviceWorker' in navigator) {
  // Lässt die Seite selbst auch ohne jede Verbindung starten (siehe public/sw.js); die Daten laufen
  // unabhängig davon über IndexedDB (Offline.*).
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
}

// --- Einrichtung: Google-Anmeldung, dann einmalig die ID des geteilten Kalenders ---
function renderSetupScreen(title, lead, ...content) {
  $('#view').replaceChildren(h('div', { class: 'step' },
    h('h1', {}, title), h('p', { class: 'lead' }, lead), ...content));
}

function renderSignIn() {
  const err = h('div', { class: 'error' });
  renderSetupScreen('🏠 Haus-Tasks', 'Diese App verwaltet Haushaltsaufgaben gemeinsam über einen geteilten Google-Kalender.',
    h('button', {
      class: 'btn primary', onclick: async () => {
        try { await Auth.signIn(); await boot(); } catch (e) { err.textContent = e.message; }
      },
    }, 'Mit Google anmelden'),
    err);
}

function renderCalendarSetup() {
  const input = h('input', { type: 'text', placeholder: 'z. B. abc123@group.calendar.google.com' });
  const err = h('div', { class: 'error' });
  renderSetupScreen('Geteilten Kalender einrichten',
    'Trage die Kalender-ID des geteilten Kalenders ein. Wer die App schon eingerichtet hat, kann dir dafür einen Einladungslink schicken (spart das Eintippen) – siehe „Haushalt einladen“.',
    h('div', { class: 'field' }, h('label', {}, 'Kalender-ID'), input),
    h('div', { class: 'hint' }, 'Zu finden in Google Kalender: Zahnrad neben dem Kalendernamen → Einstellungen → „Kalender integrieren“ → „Kalender-ID“.'),
    h('button', {
      class: 'btn primary', onclick: async () => {
        if (!input.value.trim()) { err.textContent = 'Bitte eine Kalender-ID eingeben.'; return; }
        Offline.setCalendarId(input.value.trim());
        await boot();
      },
    }, 'Übernehmen'),
    err);
}

async function boot() {
  // Nicht nur auf den zwischengespeicherten Zeitstempel schauen (der ist nach ca. einer Stunde abgelaufen,
  // auch wenn man eigentlich noch angemeldet wäre) – erst eine echte (stille) Erneuerung versuchen. Das
  // war der Hauptgrund, warum der Login auf dem Handy viel öfter verlangt wurde als am Desktop: dort wird
  // die App nach dem Schließen oft komplett neu gestartet (nicht nur ein Tab im Hintergrund), und traf so
  // viel häufiger auf einen nach Uhrzeit schon abgelaufenen, aber eigentlich noch erneuerbaren Token.
  try {
    await Auth.getToken();
  } catch (e) {
    if (e.authRequired || !Auth.hasEverSignedIn()) { renderSignIn(); return; }
    // Sonst: keine Verbindung gerade, aber schon mal angemeldet gewesen – mit dem zwischengespeicherten
    // Stand weitermachen (reload() unten zeigt die lokal gespeicherten Tasks), kein erzwungener Login nur
    // wegen eines Verbindungsproblems beim Start.
  }
  if (!Offline.getCalendarId()) { renderCalendarSetup(); return; }

  let cfg = await Offline.getConfig();
  if (!cfg) {
    // Ganz neuer, leerer Kalender: Vorgabe-Kategorien/-Orte anlegen, damit beim nächsten Sync alle
    // Geräte dieselbe Ausgangsliste bekommen statt jedes für sich eine eigene zu erfinden.
    cfg = { categories: DEFAULT_CATEGORIES, locations: DEFAULT_LOCATIONS, updated_at: new Date().toISOString() };
    await Offline.saveConfig(cfg);
  }
  state.cfg = { categories: cfg.categories, locations: cfg.locations, priorities: PRIORITIES, colors: COLORS };
  await reload();
  syncNow(true); // Sync beim Öffnen
}

(async () => {
  await Offline.init();
  Auth.onChange(() => { if (!Auth.isSignedIn()) renderSignIn(); });
  await boot();
})();
</script>
