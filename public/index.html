<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6fed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Haus-Tasks">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="shortcut icon" href="favicon.ico">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Haus-Tasks</title>
<style>
  :root {
    --bg: #fafafa; --card: #ffffff; --text: #1c2230; --muted: #6b7280; --line: #eceef1;
    --accent: #2f6fed; --accent-text: #ffffff; --danger: #d92d20; --ok: #12a150; --chip: #f1f2f4;
    --radius: 14px; --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 1px rgba(16,24,40,.03);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101216; --card: #1b1e24; --text: #e8ebf2; --muted: #9aa1ac; --line: #2a2e35;
      --accent: #5b8cff; --accent-text: #0e1420; --danger: #f97066; --ok: #47cd89; --chip: #22262d;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 16px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  header a.brand { font-size: 19px; font-weight: 700; color: inherit; text-decoration: none; display: flex; align-items: center; gap: 6px; }
  .inbox-badge { background: var(--accent); color: var(--accent-text); font-size: 11px; font-weight: 700; line-height: 1;
    padding: 3px 7px; border-radius: 999px; }
  .sync { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .dot.ok { background: var(--ok); } .dot.err { background: var(--danger); }
  button { font: inherit; cursor: pointer; }
  .btn { border: 1px solid var(--line); background: var(--card); color: var(--text); padding: 9px 16px; border-radius: 999px; transition: border-color .15s, background .15s; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn.danger { color: var(--danger); }
  .btn.small { padding: 5px 12px; font-size: 13px; }
  .icon-btn { border: none; background: none; color: var(--muted); padding: 6px; border-radius: 8px; line-height: 1; }
  .icon-btn:hover { color: var(--danger); background: var(--chip); }
  /* Zahnrad in der Kopfzeile: der einzige Eintrag rechts; der kleine Punkt ist der Sync-Status (grau/grün/rot). */
  .gear { position: relative; font-size: 20px; padding: 6px 8px; }
  .gear:hover { color: var(--accent); }
  .gear .dot { position: absolute; right: 3px; bottom: 3px; width: 7px; height: 7px; border: 2px solid var(--bg); box-sizing: content-box; }
  /* Einstellungs-Dialog: kleine Gruppen mit Überschrift. */
  .set-group { display: grid; gap: 8px; padding: 12px 0; border-top: 1px solid var(--line); }
  .set-group h4 { margin: 0; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .set-row .status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  a.btn { text-decoration: none; display: inline-block; }

  /* Klappbare Abschnitte ("Anstehend"/"Später") – bewusst unauffälliger als der frühere Navigationsblock. */
  .section { margin-bottom: 18px; }
  .section-header { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 4px 0; user-select: none; }
  .toggle-icon { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; min-width: 22px;
    border-radius: 50%; background: var(--chip); font-weight: 700; font-size: 15px; line-height: 1; }
  .section-header:hover .toggle-icon { background: var(--accent); color: var(--accent-text); }

  /* Schnellerfassung: bewusst nur ein Titel-Feld, Enter legt sofort einen Inbox-Task an. */
  .quick-capture { width: 100%; padding: 13px 16px; font-size: 15px; border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--card); color: var(--text); margin-bottom: 10px; box-shadow: var(--shadow); }
  .quick-capture:focus { outline: none; border-color: var(--accent); }
  .inbox-list { display: grid; gap: 8px; margin-bottom: 18px; }
  .inbox-row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; padding: 6px 12px; min-height: 43px; box-sizing: border-box;
    background: var(--card); border: 1px dashed var(--line); border-radius: var(--radius); }
  .inbox-row .title { cursor: pointer; }
  .inbox-row .actions { display: flex; align-items: center; gap: 4px; }
  .inbox-row .badge.list-move { padding: 1px 8px; font-size: 11.5px; }
  .inbox-row .icon-btn { padding: 2px 6px; }
  /* Deutlich sichtbarer Rahmen statt der reinen Chip-Füllung: die sonst übliche .badge-Füllfarbe
     (--chip) liegt hier auf einem ebenfalls schon getönten Untergrund (Inbox-Zeile/Task-Karte) und
     ist dort kaum vom Hintergrund zu unterscheiden. */
  .badge.list-move { border: 1px solid var(--line); background: var(--bg); color: var(--text); font-weight: 600; cursor: pointer; font: inherit; }
  .badge.list-move:hover { border-color: var(--accent); color: var(--accent); }
  .badge.list-move.ok { border-color: var(--ok); color: var(--ok); }
  .badge.list-move.ok:hover { background: color-mix(in srgb, var(--ok) 15%, transparent); }

  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 8px; }
  .toolbar label { color: var(--muted); font-size: 13px; }
  .filters { margin-bottom: 14px; }
  .filters .group { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 6px; }
  .filters .group > b { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; width: 74px; }
  /* Listen-Reiter unter der Kopfzeile */
  .tabs { display: flex; align-items: center; gap: 4px; margin: 0 0 12px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: none; display: inline-flex; align-items: center; gap: 7px; padding: 8px 12px; border: 0; border-bottom: 2px solid transparent; background: none;
    color: var(--muted); font-weight: 500; margin-bottom: -1px; white-space: nowrap; }
  .tab:hover { color: var(--text); }
  .tab.on { color: var(--text); border-bottom-color: var(--c, var(--accent)); }
  .tab .dot-c { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
  .tab.list { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; cursor: grab; }
  .tab.dragging { position: relative; z-index: 2; cursor: grabbing; background: var(--chip); border-radius: 8px 8px 0 0; box-shadow: var(--shadow); }
  .tab.add { padding: 8px 10px; font-size: 16px; }
  .tab.edit { margin-left: auto; padding: 8px 10px; }
  .section-header.static { cursor: default; }
  .chip { border: 1px solid var(--line); background: var(--chip); color: var(--text); padding: 3px 10px; border-radius: 999px; font-size: 13px; }
  .chip.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  select, input, textarea { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
  select:focus, input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  /* Asana-Listenansicht: eine zusammenhängende Karte, Zeilen nur durch dünne Linien getrennt, einzeilig. */
  .list { display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .date-input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; border: 0; padding: 0; pointer-events: none; }
  .task { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); transition: background .12s; }
  .task:last-child { border-bottom: 0; }
  .task:hover { background: color-mix(in srgb, var(--accent) 6%, var(--card)); }
  .task .right { display: flex; align-items: center; gap: 8px; justify-self: end; }
  .task .avatar { width: 24px; height: 24px; min-width: 24px; min-height: 24px; max-width: 24px; max-height: 24px; font-size: 11px; }
  .avatar-slot { width: 24px; flex: none; }
  .task .badge.chk, .task .badge.list-move { padding: 1px 8px; font-size: 11.5px; }
  /* Schnell-Verschieben nur noch beim Darüberfahren am Desktop – auf dem Handy steht dafür "Status" im Detailformular. */
  .task .badge.list-move { display: none; }
  @media (hover: hover) { .task:hover .badge.list-move { display: inline-flex; } }
  .date-chip { position: relative; display: inline-flex; align-items: center; padding: 2px 7px; border-radius: 6px; font-size: 12.5px;
    color: var(--muted); white-space: nowrap; cursor: pointer; transition: background .12s; }
  .date-chip:hover { background: var(--chip); }
  .date-chip.soon { color: var(--accent); font-weight: 600; }
  .date-chip.late { color: var(--danger); font-weight: 600; }
  .date-chip.done { opacity: .55; }
  .date-chip.none { opacity: .3; }
  .date-chip.none:hover { opacity: .8; }
  .task.done { opacity: .72; }
  /* Auswahlmodus: die ganze Zeile ist nur noch Auswahlfläche, nichts darin reagiert einzeln. */
  .task.selectable { cursor: pointer; }
  .task.selectable * { pointer-events: none; }
  .task.selectable.selected, .task.selectable.selected:hover { background: color-mix(in srgb, var(--accent) 14%, var(--card)); }
  .select-dot { display: grid; place-content: center; width: 22px; height: 22px; min-width: 22px; border-radius: 50%;
    border: 2px solid var(--line); font-size: 13px; font-weight: 700; color: var(--accent-text); justify-self: center; align-self: center; }
  .task.selected .select-dot { background: var(--accent); border-color: var(--accent); }
  .select-bar { position: sticky; bottom: 12px; z-index: 6; display: flex; align-items: center; gap: 8px; margin-top: 12px;
    padding: 10px 12px; background: var(--card); border: 1px solid var(--accent); border-radius: var(--radius); box-shadow: 0 4px 16px rgba(0,0,0,.3); }
  .select-bar .count { flex: 1; font-weight: 600; font-size: 14px; }
  .cal-check { flex-wrap: wrap; margin: 4px 0 10px; color: var(--text); }
  .cal-check small { flex-basis: 100%; color: var(--muted); font-size: 12px; padding-left: 24px; }
  .cal-mark { margin-left: 4px; font-size: 11px; opacity: .75; }
  .inline-check { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 13px; color: var(--muted); }
  .task.done .title { text-decoration: line-through; color: var(--muted); }
  /* Runde Checkbox statt eckigem Häkchen. width/height allein reichten nicht in jedem Browser (Grid-
     Kinder werden sonst auf die Spaltenbreite gestreckt); aspect-ratio plus min/max-Werte erzwingen das
     Quadrat zusätzlich, unabhängig von Stretching-Effekten. */
  .task input[type=checkbox] { appearance: none; -webkit-appearance: none; -moz-appearance: none;
    width: 22px; height: 22px; min-width: 22px; min-height: 22px; max-width: 22px; max-height: 22px;
    aspect-ratio: 1; border-radius: 50%; margin: 0; padding: 0;
    border: 2px solid var(--line); background: var(--card); display: grid; place-content: center; cursor: pointer;
    justify-self: center; align-self: center; flex: none;
    transition: border-color .15s, background .15s; }
  .task input[type=checkbox]::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: #fff; transform: scale(0); transition: transform .12s; }
  .task input[type=checkbox]:checked { border-color: var(--accent); background: var(--accent); }
  .task input[type=checkbox]:checked::before { transform: scale(1); }
  .task .main { min-width: 0; cursor: pointer; }
  .title { font-weight: 500; overflow-wrap: anywhere; line-height: 1.3; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 10px; margin-top: 4px; font-size: 12.5px; color: var(--muted); align-items: center; }
  .badge { padding: 2px 9px; border-radius: 999px; background: var(--chip); font-size: 12px; display: inline-flex; align-items: center; gap: 5px; }
  .empty { text-align: center; color: var(--muted); padding: 32px 0; }

  .avatar { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px;
    min-width: 28px; min-height: 28px; max-width: 28px; max-height: 28px; aspect-ratio: 1; border-radius: 50%;
    background: var(--ac, var(--muted)); color: #fff; font-size: 12px; font-weight: 700; flex: none; justify-self: center; align-self: center; }
  .avatar.sm { width: 22px; height: 22px; min-width: 22px; min-height: 22px; max-width: 22px; max-height: 22px; font-size: 11px; }
  .avatar-picker { display: flex; flex-wrap: wrap; gap: 8px; }
  .avatar-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; padding: 2px; color: var(--muted); font-size: 12px; border-radius: 10px; }
  .avatar-btn .avatar { border: 3px solid transparent; }
  .avatar-btn.on .avatar { border-color: var(--text); }
  .avatar-btn.on { color: var(--text); font-weight: 600; }

  .group-card { margin-bottom: 20px; }
  .group-card h2 { display: flex; align-items: center; gap: 10px; font-size: 17px; margin: 0 0 8px; }
  .group-card h2 span.count { color: var(--muted); font-weight: 400; font-size: 13px; }
  .swatch { width: 14px; height: 14px; border-radius: 50%; display: inline-block; background: var(--c); }
  .backlink { color: var(--accent); text-decoration: none; font-size: 14px; }
  h1 { font-size: 22px; margin: 6px 0 16px; }

  dialog { border: 1px solid var(--line); border-radius: 16px; background: var(--card); color: var(--text); width: min(560px, calc(100vw - 24px)); padding: 0; }
  dialog::backdrop { background: rgba(10,14,22,.5); }
  #form { padding: 20px; display: grid; gap: 14px; }
  #form h3 { margin: 0; font-size: 18px; }
  .field { display: grid; gap: 4px; }
  .field > label { font-size: 13px; color: var(--muted); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .inline { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .inline input[type=number] { width: 72px; }
  .swatches { display: flex; flex-wrap: wrap; gap: 8px; }
  .sw { width: 28px; height: 28px; border-radius: 50%; border: 3px solid transparent; background: var(--c); padding: 0; }
  .sw.on { border-color: var(--text); }
  .actions { display: flex; justify-content: space-between; gap: 8px; margin-top: 4px; }
  .actions .right { display: flex; gap: 8px; }
  .error { color: var(--danger); font-size: 13px; min-height: 1em; }
  .sync-info { color: var(--muted); font-size: 11px; margin: -8px 0 10px; }
  .hint { color: var(--muted); font-size: 13px; }

  /* Einrichtungsbildschirme: Anmeldung, Kalender-ID */
  .step { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; margin-top: 20px; display: grid; gap: 14px; max-width: 440px; }
  .step h1 { margin: 0; font-size: 20px; }
  .step .lead { color: var(--muted); margin: 0; }

  /* Erneute Anmeldung mitten in der Nutzung: nicht die ganze Ansicht ersetzen, nur ein schmaler Hinweis
     mit Ein-Klick-Anmeldung – die zwischengespeicherten Tasks bleiben währenddessen sichtbar. */
  .auth-banner { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: color-mix(in srgb, var(--accent) 12%, var(--card));
    border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line)); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 14px; font-size: 14px; }
  .auth-banner span { flex: 1; min-width: 180px; }

  .badge.chk { border: none; color: inherit; cursor: pointer; font: inherit; font-size: 12px; }
  .badge.chk:hover { outline: 1px solid var(--accent); }
  .badge.chk.ok { background: color-mix(in srgb, var(--ok) 22%, transparent); color: var(--ok); }
  .chk-list { list-style: none; margin: 8px 0 2px; padding: 0; display: grid; gap: 6px; cursor: default; }
  .chk-list label { display: flex; align-items: flex-start; gap: 8px; cursor: pointer; }
  .chk-list li.done span { text-decoration: line-through; color: var(--muted); }
  .chk-rows { display: grid; gap: 6px; }
  .chk-row { display: grid; grid-template-columns: auto auto 1fr auto; gap: 8px; align-items: center; }
  .chk-row.dragging { position: relative; z-index: 5; opacity: .85; background: var(--chip); border-radius: 8px; }
  .chk-drag { cursor: grab; touch-action: none; }
  .chk-drag:active { cursor: grabbing; }
  /* Runde Checkbox wie beim Task selbst (siehe .task input[type=checkbox]), nur kleiner. */
  .chk-list input[type=checkbox], .chk-row input[type=checkbox] { appearance: none; -webkit-appearance: none; -moz-appearance: none;
    width: 18px; height: 18px; min-width: 18px; min-height: 18px; max-width: 18px; max-height: 18px;
    aspect-ratio: 1; border-radius: 50%; margin: 0; padding: 0; margin-top: 1px;
    border: 2px solid var(--line); background: var(--card); display: grid; place-content: center; cursor: pointer;
    flex: none; transition: border-color .15s, background .15s; }
  .chk-list input[type=checkbox]::before, .chk-row input[type=checkbox]::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #fff; transform: scale(0); transition: transform .12s; }
  .chk-list input[type=checkbox]:checked, .chk-row input[type=checkbox]:checked { border-color: var(--accent); background: var(--accent); }
  .chk-list input[type=checkbox]:checked::before, .chk-row input[type=checkbox]:checked::before { transform: scale(1); }
  .chk-add { justify-self: start; margin-top: 6px; }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; z-index: 10; }
  dialog { max-height: calc(100dvh - 24px); overflow-y: auto; }
  .wrap { padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); padding-bottom: max(16px, env(safe-area-inset-bottom)); }

  /* Handy: größere Tippflächen, 16px in Feldern (sonst zoomt iOS beim Antippen), kompaktere Zeilen */
  @media (max-width: 520px) {
    .wrap { padding-top: max(12px, env(safe-area-inset-top)); }
    .row2 { grid-template-columns: 1fr; }
    .filters .group > b { width: 100%; }
    input, select, textarea { font-size: 16px; }
    .btn { padding: 10px 14px; }
    .btn.small { padding: 7px 12px; }
    .icon-btn { padding: 10px; }
    .task { gap: 8px; padding: 10px; }
    .task input[type=checkbox] { width: 24px; height: 24px; min-width: 24px; min-height: 24px; max-width: 24px; max-height: 24px; }
    .select-dot { width: 24px; height: 24px; min-width: 24px; }
    .task .right { gap: 6px; }
    .toolbar select { flex: 1; min-width: 0; }
    header { flex-wrap: wrap; }
    .group-card h2 { flex-wrap: wrap; }
    #form { padding: 16px; }
    .sw { width: 34px; height: 34px; }
    .avatar { width: 30px; height: 30px; min-width: 30px; min-height: 30px; max-width: 30px; max-height: 30px; font-size: 13px; }
    .actions { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="#/">🏠 Haus-Tasks<span class="inbox-badge" id="inboxBadge" hidden title="Unsortierte Einträge in der Inbox"></span></a>
    <div class="sync">
      <button class="icon-btn gear" id="settingsBtn" title="Einstellungen, Sync &amp; mehr">⚙<span class="dot" id="syncDot"></span></button>
    </div>
  </header>
  <div id="authBanner"></div>
  <nav id="listTabs" class="tabs" aria-label="Listen"></nav>
  <form id="quickForm" hidden><input id="quickInput" class="quick-capture" type="text" enterkeyhint="send" autocomplete="off" placeholder="Idee oder Task eintippen, Enter zum Speichern …"></form>
  <main id="view"></main>
</div>

<dialog id="dlg"><form id="form" method="dialog"></form></dialog>

<!-- Unterbau: Serienberechnung, Regeln fürs lokale Anwenden von Änderungen, Sync-Algorithmus gegen Google,
     Google-Anmeldung, Google-Calendar-Zugriff, IndexedDB-/Warteschlangen-Anbindung. Reihenfolge wichtig
     (jedes baut aufs vorige auf). -->
<script src="recurrence.js"></script>
<script src="offline-logic.js"></script>
<script src="sync-core.js"></script>
<script src="google-config.js"></script>
<script src="auth.js"></script>
<script src="gcal-remote.js"></script>
<script src="offline.js"></script>
<script>
const $ = (s, r = document) => r.querySelector(s);
// Feste Listen-IDs (gleich wie in offline-logic.js). Hier bewusst nicht aus OfflineLogic gelesen: lädt der Browser nach einem
// Update noch eine ältere offline-logic.js, wäre der Wert undefined und eine damit angelegte Liste würde stillschweigend
// verworfen.
const MAIN_LIST = 'tasks';
const LATER_LIST = 'spaeter';
const WEEKDAYS = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
const PRIO_RANK = { hoch: 0, mittel: 1, niedrig: 2 };
const ASSIGNEES = ['Caro', 'Hannes'];
const ASSIGNEE_INITIAL = { Caro: 'C', Hannes: 'H' };
const ASSIGNEE_COLOR = { Caro: '#e05297', Hannes: '#2f6fed' }; // nur fürs Avatar-Kürzel, unabhängig von Kategoriefarben
const state = {
  tasks: [], cfg: null, status: null, assignees: new Set(), lists: [{ id: 'tasks', name: 'Tasks', color: '9' }], listId: 'tasks', showDone: false, sort: 'due', expanded: new Set(),
  lastSyncAt: null, lastSyncError: null, online: true, syncHistory: [], selecting: false, selected: new Set(),
  todoOpen: true, laterOpen: false, // "Später" bewusst standardmäßig eingeklappt, weniger prominent als "Anstehend"
};

// Elemente ohne innerHTML bauen, damit Nutzereingaben nie als Markup gelten.
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'style') e.setAttribute('style', v);
    else if (k in e && k !== 'list') e[k] = v;
    else e.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) e.append(kid.nodeType ? kid : document.createTextNode(kid));
  return e;
}

// Reicht ausstehende lokale Änderungen sofort nach, falls die Verbindung inzwischen wieder da ist,
// ohne bei jeder einzelnen Aktion einen vollen Sync anzustoßen.
function kickSync() {
  Offline.pendingCount().then((n) => { if (n > 0) syncNow(true); });
}

// Nur tatsächlich geänderte Felder gehen in einen Patch (nicht das ganze Formular), damit eine
// Bearbeitung nie unbeachtet gebliebene Felder überschreibt, die inzwischen z. B. über ein anderes
// Gerät geändert wurden. sync-core.js führt das beim Senden konfliktsicher mit Googles aktuellem Stand zusammen.
function diffPatch(original, body) {
  const patch = {};
  for (const k of Object.keys(body)) {
    if (JSON.stringify(body[k]) !== JSON.stringify(original?.[k])) patch[k] = body[k];
  }
  return patch;
}

function toast(msg) {
  const t = h('div', { class: 'toast' }, msg);
  document.body.append(t);
  setTimeout(() => t.remove(), 3500);
}

const hex = (id) => state.cfg.colors[id]?.hex || '#9e9e9e';
const todayStr = () => new Date().toLocaleDateString('sv-SE');
const dayDiff = (iso) => Math.round((Date.parse(iso + 'T00:00:00Z') - Date.parse(todayStr() + 'T00:00:00Z')) / 864e5);
const fmtDate = (iso) => new Date(iso + 'T12:00:00').toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit', year: 'numeric' });

// Direkt antippbar: öffnet den nativen Datumswähler, ohne erst den ganzen Task öffnen zu müssen.
// Das eigentliche <input type=date> bleibt unsichtbar und dient nur als Datumswähler-Auslöser.
async function quickSetDate(t, value) {
  try {
    await Offline.mutate('task', 'update', { id: t.id, patch: { due_date: value || null } });
    await reload();
    kickSync();
  } catch (e) { toast(e.message); reload(); }
}

// Kompakte Datumsangabe rechts in der Zeile ("Mi 30.9." plus ggf. Uhrzeit); antippen öffnet direkt den
// Datumswähler. Termine mit Uhrzeit zeigen sie mit an, den vollen Wortlaut gibt es im Tooltip.
function dateChip(t) {
  const picker = h('input', { type: 'date', value: t.due_date || '', class: 'date-input', tabindex: -1, 'aria-hidden': 'true' });
  picker.addEventListener('click', (e) => e.stopPropagation());
  picker.addEventListener('change', () => quickSetDate(t, picker.value));
  const openPicker = (e) => { e.stopPropagation(); picker.showPicker ? picker.showPicker() : picker.focus(); };

  if (!t.due_date) return h('span', { class: 'date-chip none', title: 'Datum setzen – antippen', onclick: openPicker }, '–', picker);
  const d = new Date(t.due_date + 'T12:00:00');
  const diff = dayDiff(t.due_date);
  const cls = t.done ? ' done' : diff < 0 ? ' late' : diff <= 1 ? ' soon' : '';
  const yearSuffix = d.getFullYear() !== new Date().getFullYear() ? ` ’${String(d.getFullYear()).slice(2)}` : '';
  const timeLabel = t.due_time && (t.due_end_time ? `${t.due_time}–${t.due_end_time}` : t.due_time);
  const label = d.toLocaleDateString('de-DE', { weekday: 'short', day: 'numeric', month: 'numeric' }).replace(/\.,\s*/, ' ') + yearSuffix + (timeLabel ? ` · ${timeLabel}` : '');
  return h('span', { class: 'date-chip' + cls, title: fmtDate(t.due_date) + (timeLabel ? `, ${timeLabel} Uhr` : '') + (t.in_calendar ? ' · steht im Google-Kalender' : '') + ' – antippen zum Ändern', onclick: openPicker }, label, t.in_calendar && h('span', { class: 'cal-mark' }, '📅'), picker);
}


// --- Sortieren & Filtern ---
// Tasks ohne Datum sollen ganz oben stehen (leerer String sortiert vor jedem echten Datum), nicht ganz unten.
const dueCmp = (a, b) => (a.due_date || '').localeCompare(b.due_date || '');
// Neueste zuerst. Neu eingetragene Tasks haben noch kein Datum und sollen bei der Standardsortierung ganz oben stehen.
const newestCmp = (a, b) => (b.created_at || '').localeCompare(a.created_at || '');
const prioCmp = (a, b) => PRIO_RANK[a.priority] - PRIO_RANK[b.priority];
const SORTS = {
  due: { label: 'Fälligkeit, Neue zuerst', fn: (a, b) => dueCmp(a, b) || (a.due_date ? 0 : newestCmp(a, b)) || prioCmp(a, b) || a.title.localeCompare(b.title) },
  prio: { label: 'Priorität, dann Fälligkeit', fn: (a, b) => prioCmp(a, b) || dueCmp(a, b) || a.title.localeCompare(b.title) },
  title: { label: 'Titel A–Z', fn: (a, b) => a.title.localeCompare(b.title) },
};

function sorted(list, sortFn = SORTS[state.sort].fn) {
  const open = list.filter((t) => !t.done).sort(sortFn);
  const done = list.filter((t) => t.done).sort((a, b) => (b.done_at || '').localeCompare(a.done_at || ''));
  return state.showDone ? [...open, ...done] : open;
}

// --- Task-Zeile ---
// Bewusst schlank gehalten: nur Kreis zum Abhaken, Titel, Datum und ob es eine Checkliste gibt. Alles
// andere (Kategorie, Ort, Zuständigkeit, Priorität, Notizen, Serie) sieht man beim Öffnen des Tasks;
// über Sortierung und Filter lässt sich trotzdem gezielt einschränken.
// Löschen gibt's nur noch in der Detailansicht (siehe openForm) – hier an derselben Stelle stattdessen
// die Zuständigkeit, damit auf einen Blick sichtbar bleibt, wer den Task übernommen hat.
function taskRow(t) {
  // Auswahlmodus (Mehrfachbearbeitung): die ganze Zeile schaltet nur noch die Auswahl um, statt Abhaken,
  // Datum-Schnellwahl oder Detailansicht auszulösen.
  if (state.selecting) {
    const sel = state.selected.has(t.id);
    return h('div', { class: 'task selectable' + (sel ? ' selected' : '') + (t.done ? ' done' : ''), onclick: () => toggleSelect(t.id) },
      h('span', { class: 'select-dot' }, sel ? '✓' : ''),
      h('div', { class: 'main' }, h('div', { class: 'title' }, t.title)),
      h('div', { class: 'right' }, dateChip(t), avatar(t.assignee) || h('span', { class: 'avatar-slot' })));
  }
  // Einzeilig wie Asanas Listenansicht: Häkchen, Titel, rechts Checklisten-Stand, Datum, Zuständigkeit.
  return h('div', { class: 'task' + (t.done ? ' done' : '') },
    h('input', { type: 'checkbox', checked: t.done, title: t.done ? 'Wieder öffnen' : 'Abhaken', onchange: (e) => toggleDone(t, e.target.checked) }),
    h('div', { class: 'main', onclick: () => openForm(t) },
      h('div', { class: 'title' }, t.title),
      state.expanded.has(t.id) && t.checklist.length > 0 && checklistView(t)),
    h('div', { class: 'right' },
      t.checklist.length > 0 && checklistBadge(t), listMoveBadge(t), dateChip(t), avatar(t.assignee) || h('span', { class: 'avatar-slot' })));
}

// Kleiner Avatar-Kreis mit Kürzel für die Zuständigkeit, wie Asanas Zuweisungs-Icons.
function avatar(assignee, size) {
  if (!assignee) return null;
  return h('span', { class: 'avatar' + (size ? ' ' + size : ''), style: `--ac:${ASSIGNEE_COLOR[assignee] || '#888'}`, title: assignee }, ASSIGNEE_INITIAL[assignee] || '?');
}

// Checkliste („Sub-Tasks light“): Fortschritt als Badge, Klick klappt die Punkte zum direkten Abhaken auf.
function checklistBadge(t) {
  const done = t.checklist.filter((i) => i.done).length;
  const open = state.expanded.has(t.id);
  return h('button', {
    class: 'badge chk' + (done === t.checklist.length ? ' ok' : ''),
    title: open ? 'Checkliste einklappen' : 'Checkliste aufklappen',
    onclick: (e) => { e.stopPropagation(); open ? state.expanded.delete(t.id) : state.expanded.add(t.id); render(); },
  }, `☑ ${done}/${t.checklist.length} ${open ? '▴' : '▾'}`);
}

function checklistView(t) {
  return h('ul', { class: 'chk-list', onclick: (e) => e.stopPropagation() },
    t.checklist.map((item, i) => h('li', { class: item.done ? 'done' : '' },
      h('label', {}, h('input', { type: 'checkbox', checked: item.done, onchange: (e) => toggleItem(t, i, e.target.checked) }), h('span', {}, item.text)))));
}

// Checkliste wird als volles Array gesendet (nicht nur der eine geänderte Punkt) – wird schnell
// hintereinander mehrfach abgehakt, würde ein zweiter Klick sonst noch mit dem Stand von VOR dem ersten
// rechnen und dessen gerade gesetztes Häkchen beim Senden wieder rückgängig machen (stiller
// Datenverlust, genau das war vermutlich die Ursache für den abweichenden Checklisten-Stand). Eine
// Warteschlange pro Task serialisiert die Klicks: der nächste Toggle rechnet erst, wenn der vorherige
// wirklich fertig gespeichert ist.
const toggleQueue = new Map();
function toggleItem(t, index, done) {
  const run = async () => {
    try {
      const current = state.tasks.find((x) => x.id === t.id) || t;
      const checklist = current.checklist.map((item, i) => (i === index ? { ...item, done } : item));
      const updated = await Offline.mutate('task', 'update', { id: t.id, patch: { checklist } });
      state.tasks = state.tasks.map((x) => (x.id === updated.id ? updated : x));
      render();
      kickSync();
    } catch (e) { toast(e.message); reload(); }
  };
  const next = (toggleQueue.get(t.id) || Promise.resolve()).then(run);
  toggleQueue.set(t.id, next.catch(() => {}));
  return next;
}

// --- Mehrfachauswahl & Mehrfachbearbeitung ---
function toggleSelect(id) {
  state.selected.has(id) ? state.selected.delete(id) : state.selected.add(id);
  render();
}
function exitSelectMode() {
  state.selecting = false;
  state.selected.clear();
  render();
}

// Wendet dieselbe Änderung nacheinander auf alle ausgewählten Tasks an. Einzelne Fehlschläge (z. B. Datum
// entfernen bei einer Serie, die ein Datum braucht) stoppen den Rest nicht, sondern werden am Ende gemeldet.
async function applyBulk(ids, patch) {
  let ok = 0;
  const errors = [];
  for (const id of ids) {
    const t = state.tasks.find((x) => x.id === id);
    try {
      await Offline.mutate('task', 'update', { id, patch });
      ok++;
    } catch (e) { errors.push(`${t?.title || id}: ${e.message}`); }
  }
  return { ok, errors };
}

const KEEP = '__keep';
function openBulkForm() {
  const ids = [...state.selected];
  const cfg = state.cfg;
  const keepOpt = (label) => h('option', { value: KEEP }, label);
  const date = h('input', { type: 'date' });
  const clearDate = h('input', { type: 'checkbox' });
  clearDate.addEventListener('change', () => { date.disabled = clearDate.checked; if (clearDate.checked) date.value = ''; });
  const listSel = h('select', {}, keepOpt('– unverändert –'), state.lists.map((l) => h('option', { value: l.id }, l.name)));
  const who = h('select', {}, keepOpt('– unverändert –'), h('option', { value: '' }, 'Niemand'), ASSIGNEES.map((a) => h('option', { value: a }, a)));
  const prio = h('select', {}, keepOpt('– unverändert –'), cfg.priorities.map((p) => h('option', { value: p }, p)));
  const bucket = h('select', {}, keepOpt('– unverändert –'), h('option', { value: 'todo' }, 'Anstehend'), h('option', { value: 'inbox' }, 'Inbox (noch einsortieren)'));
  const inCal = h('select', {}, keepOpt('– unverändert –'), h('option', { value: 'yes' }, 'Ja, anzeigen (Tasks ohne Datum nicht)'), h('option', { value: 'no' }, 'Nein, nur in der App'));
  const err = h('div', { class: 'error' });
  const form = $('#form');
  const field = (label, ...ctl) => h('div', { class: 'field' }, h('label', {}, label), ...ctl);

  form.onsubmit = async (e) => {
    e.preventDefault();
    // Nur ausgefüllte Felder gehen in den Patch – alles andere bleibt bei jedem Task, wie es ist.
    const patch = {};
    if (clearDate.checked) patch.due_date = null;
    else if (date.value) patch.due_date = date.value;
    if (listSel.value !== KEEP) patch.list_id = listSel.value;
    if (who.value !== KEEP) patch.assignee = who.value || null;
    if (prio.value !== KEEP) patch.priority = prio.value;
    if (bucket.value !== KEEP) patch.bucket = bucket.value;
    if (patch.list_id && patch.list_id !== MAIN_LIST) delete patch.bucket; // Inbox gibt es nur in der Hauptliste
    if (inCal.value !== KEEP) patch.in_calendar = inCal.value === 'yes';
    if (!Object.keys(patch).length) { err.textContent = 'Nichts zum Ändern ausgewählt.'; return; }
    const { ok, errors } = await applyBulk(ids, patch);
    $('#dlg').close();
    exitSelectMode();
    await reload();
    kickSync();
    toast(errors.length ? `⚠ ${ok} von ${ids.length} geändert. Nicht geändert: ${errors.join('; ')}` : `${ok} Task${ok === 1 ? '' : 's'} geändert.`);
  };

  form.replaceChildren(
    h('h3', {}, `${ids.length} Task${ids.length === 1 ? '' : 's'} bearbeiten`),
    h('div', { class: 'hint' }, 'Nur was du hier änderst, wird bei allen ausgewählten Tasks gesetzt – alles andere bleibt unverändert.'),
    field('Datum', date, h('label', { class: 'inline-check' }, clearDate, ' Datum entfernen')),
    h('div', { class: 'row2' }, field('Liste', listSel), field('In Google Kalender', inCal)),
    h('div', { class: 'row2' }, field('Zuständigkeit', who), field('Priorität', prio)),
    field('Status (nur Liste „' + (state.lists.find((l) => l.id === MAIN_LIST)?.name || 'Tasks') + '“)', bucket),
    err,
    h('div', { class: 'actions' },
      h('span'),
      h('div', { class: 'right' },
        h('button', { type: 'button', class: 'btn', onclick: () => $('#dlg').close() }, 'Abbrechen'),
        h('button', { type: 'submit', class: 'btn primary' }, 'Übernehmen'))));
  $('#dlg').showModal();
}

// Leiste am unteren Rand im Auswahlmodus: Anzahl, alle (sichtbaren) auswählen, Bearbeiten, Abbrechen.
function selectBar(visibleIds) {
  const n = state.selected.size;
  const allSelected = visibleIds.length > 0 && visibleIds.every((id) => state.selected.has(id));
  return h('div', { class: 'select-bar' },
    h('span', { class: 'count' }, n ? `${n} ausgewählt` : 'Tasks antippen zum Auswählen'),
    h('button', { class: 'btn small', onclick: () => { allSelected ? visibleIds.forEach((id) => state.selected.delete(id)) : visibleIds.forEach((id) => state.selected.add(id)); render(); } }, allSelected ? 'Keine' : 'Alle'),
    h('button', { class: 'btn small primary', disabled: !n, onclick: openBulkForm }, 'Bearbeiten …'),
    h('button', { class: 'btn small', onclick: exitSelectMode }, 'Abbrechen'));
}

async function toggleDone(t, done) {
  try {
    await Offline.mutate('task', 'done', { id: t.id, done });
    await reload();
    kickSync();
  } catch (e) { toast(e.message); reload(); }
}

// Schnelles Verschieben zwischen Hauptliste und der Liste „Später“, direkt in der Zeile statt über die Detailansicht.
function listMoveBadge(t) {
  const list = listOf(t);
  if (list === MAIN_LIST) return h('button', { class: 'badge list-move', title: 'In die Liste „Später“ verschieben', onclick: (e) => { e.stopPropagation(); moveToLater(t); } }, '→ Später');
  if (list === LATER_LIST) return h('button', { class: 'badge list-move', title: 'Zurück in die Hauptliste', onclick: (e) => { e.stopPropagation(); moveBucket(t, { list_id: MAIN_LIST }); } }, '↑ Tasks');
  return null;
}

// Die Liste „Später“ gibt es nur, wenn sie jemand braucht: beim ersten Verschieben (oder bei der Umstellung alter
// „Später“-Tasks) wird sie angelegt – mit fester ID, damit mehrere Geräte nicht jeweils eine eigene erfinden.
async function ensureLaterList(extraSettings = {}) {
  if (!state.lists.some((l) => l.id === LATER_LIST)) {
    const used = new Set(state.lists.map((l) => l.color));
    const color = Object.keys(state.cfg.colors).find((id) => id !== '8' && !used.has(id)) || '9';
    await Offline.setSettings({ lists: [...state.lists, { id: LATER_LIST, name: 'Später', color }], ...extraSettings });
    await refreshLists();
    if (!state.lists.some((l) => l.id === LATER_LIST)) throw new Error('Die Liste „Später“ konnte nicht angelegt werden.');
  } else if (Object.keys(extraSettings).length) {
    await Offline.setSettings(extraSettings);
  }
}
async function moveToLater(t) {
  try {
    await ensureLaterList();
    await Offline.mutate('task', 'update', { id: t.id, patch: { list_id: LATER_LIST, bucket: 'todo' } });
    await reload();
    kickSync();
    syncNow(true); // neue Liste = geänderte Einstellung, steht nicht in der Warteschlange
  } catch (e) { toast(e.message); reload(); }
}

// Einmalige Umstellung: der frühere Status „Später“ ist jetzt die Liste „Später“. Läuft nach jedem Laden/Sync, weil
// ein noch nicht aktualisiertes Gerät weiterhin Tasks mit dem alten Status anlegen kann.
let migratingLater = false;
async function migrateLater() {
  if (migratingLater) return;
  migratingLater = true;
  try {
    const old = state.tasks.filter((t) => t.bucket === 'later');
    // Die Liste „Später“ gibt es nach der Umstellung einmalig immer (auch leer); wer sie danach löscht, bekommt sie nicht
    // gegen seinen Willen zurück (laterMigrated, gemeinsame Einstellung).
    const migrated = (await Offline.getSettings()).laterMigrated;
    if (!migrated) await ensureLaterList({ laterMigrated: true });
    if (!old.length) { if (!migrated) syncNow(true); return; }
    await ensureLaterList();
    for (const t of old) await Offline.mutate('task', 'update', { id: t.id, patch: { list_id: LATER_LIST, bucket: 'todo' } });
    await reload();
    kickSync();
    syncNow(true);
  } catch (e) { toast('Umstellung auf die Liste „Später“ fehlgeschlagen: ' + e.message); } finally { migratingLater = false; }
}

async function moveBucket(t, bucket) {
  try {
    await Offline.mutate('task', 'update', { id: t.id, patch: { bucket } });
    await reload();
    kickSync();
  } catch (e) { toast(e.message); reload(); }
}

async function removeTask(t) {
  if (!confirm(`„${t.title}“ löschen? Der Kalendereintrag in Google wird ebenfalls gelöscht.`)) return;
  try {
    await Offline.mutate('task', 'delete', { id: t.id });
    await reload();
    kickSync();
  } catch (e) { toast(e.message); }
}

function taskList(list, emptyText, sortFn) {
  const rows = sorted(list, sortFn);
  return h('div', { class: 'list' }, rows.length ? rows.map(taskRow) : h('div', { class: 'empty' }, emptyText));
}

// --- Seiten ---
function doneToggle() {
  return h('label', {}, h('input', { type: 'checkbox', checked: state.showDone, onchange: (e) => { state.showDone = e.target.checked; render(); } }), ' Erledigte anzeigen');
}

function chipGroup(label, names, set) {

    h('b', {}, label),
    names.map((n) => h('button', { class: 'chip' + (set.has(n) ? ' on' : ''), onclick: () => { set.has(n) ? set.delete(n) : set.add(n); render(); } }, n)));

// --- Schnellerfassung & Inbox ---
// GTD-Prinzip: erfassen ohne nachzudenken (nur Titel, Enter), einsortieren kommt danach.
// Das Feld steht fest im Seitenrahmen (index.html, #quickForm), NICHT in der per render() immer wieder
// neu aufgebauten Ansicht: Bei jedem Speichern und jedem Sync-Abschluss wird die ganze Ansicht ersetzt, ein
// dort liegendes Feld würde dabei Fokus und schon getippten Text verlieren – so lassen sich mehrere
// Einträge direkt hintereinander eintippen, auf dem Handy bleibt die Tastatur offen.
// Echtes <form> statt keydown auf "Enter": Handy-Tastaturen schicken bei der Aktionstaste nicht zuverlässig
// ein Enter-Tastenereignis, lösen aber immer das Absenden aus. enterkeyhint "send" zeigt die Taste als
// Senden-Pfeil und lässt (anders als "done") die Tastatur offen.
// Die Einträge laufen über eine Kette nacheinander durch: Offline.mutate() liest und schreibt die ganze
// Taskliste, zwei gleichzeitige Aufrufe würden sich sonst gegenseitig überschreiben.
let quickCaptureChain = Promise.resolve();
function initQuickCapture() {
  const form = $('#quickForm');
  const input = $('#quickInput');
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const title = input.value.trim();
    if (!title) return;
    input.value = ''; // sofort leeren, damit man ohne Wartezeit den nächsten Eintrag tippen kann
    quickCaptureChain = quickCaptureChain.then(async () => {
      try {
        // In der Hauptliste landet alles erst in der Inbox, in jeder anderen Liste direkt als Eintrag.
        await Offline.mutate('task', 'create', { input: { title, list_id: state.listId, bucket: state.listId === MAIN_LIST ? 'inbox' : 'todo' } });
        await reload();
        kickSync();
      } catch (err) {
        toast(err.message);
        if (!input.value) input.value = title; // nicht verlieren, falls das Speichern scheiterte
      }
    });
  });
}

async function triageInbox(t, patch) {
  try {
    await Offline.mutate('task', 'update', { id: t.id, patch });
    await reload();
    kickSync();
  } catch (e) { toast(e.message); reload(); }
}

// 2-Minuten-Regel: Kleinkram direkt aus der Inbox heraus erledigen, ohne den Umweg über "To Do".
async function completeFromInbox(t) {
  try {
    await Offline.mutate('task', 'update', { id: t.id, patch: { bucket: 'todo' } });
    await Offline.mutate('task', 'done', { id: t.id, done: true });
    await reload();
    kickSync();
  } catch (e) { toast(e.message); reload(); }
}

function inboxRow(t) {
  return h('div', { class: 'inbox-row' },
    h('span', { class: 'title', onclick: () => openForm(t) }, t.title),
    h('div', { class: 'actions' },
      h('button', { class: 'badge list-move ok', title: '2-Minuten-Regel: gleich erledigt', onclick: () => completeFromInbox(t) }, '✓'),
      h('button', { class: 'badge list-move', title: 'Zu To Do', onclick: () => triageInbox(t, { bucket: 'todo' }) }, 'To Do'),
      h('button', { class: 'badge list-move', title: 'In die Liste „Später“', onclick: () => moveToLater(t) }, 'Später'),
      h('button', { class: 'icon-btn', title: 'Verwerfen', onclick: () => removeTask(t) }, '✕')));
}

function inboxSection() {
  const items = state.tasks.filter((t) => (t.bucket || 'todo') === 'inbox').sort(newestCmp);
  if (!items.length) return null;
  return h('div', { class: 'inbox-list' }, items.map(inboxRow));
}

// Klappbare Abschnitts-Überschrift – hält "Später" bewusst unauffällig (standardmäßig eingeklappt),
// statt wie zuvor als eigener, prominenter Navigationsblock ganz oben.
function sectionHeader(title, count, open, onToggle) {
  return h('div', { class: 'section-header', onclick: onToggle },
    h('span', { class: 'toggle-icon' }, open ? '−' : '+'),
    h('strong', {}, `${title} (${count})`));
